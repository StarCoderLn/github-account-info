name: One-time AWS Runtime Pause

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reviewed pause phase
        required: true
        type: choice
        options:
          - create-policy-change-set
          - execute-policy-change-set
          - recover-performance-rollback
          - create-runtime-change-sets
          - execute-runtime-pause
      source_run_id:
        description: Numeric run ID that created the Change Sets
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate AWS deployment configuration
        shell: bash
        env:
          EXPECTED_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DEPLOY_ROLE_ARN" =~ ^arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "AWS_DEPLOY_ROLE_ARN must contain the deployment role ARN" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify deployment identity and branch
        shell: bash
        env:
          EXPECTED_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          expected_role_name="${EXPECTED_DEPLOY_ROLE_ARN##*/}"
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"
          if [[ "$identity_arn" != *":assumed-role/${expected_role_name}/"* ]]; then
            echo "Unexpected deployment identity: $identity_arn" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "This one-time operation is restricted to master" >&2
            exit 1
          fi

      - name: Create pause policy Change Set
        if: inputs.operation == 'create-policy-change-set'
        shell: bash
        run: |
          set -euo pipefail
          stack_name="github-account-info-operations-pause-policy"
          change_set_name="pause-policy-${GITHUB_RUN_ID}"
          if aws cloudformation describe-stacks --stack-name "$stack_name" >/dev/null 2>&1; then
            change_set_type="UPDATE"
          else
            change_set_type="CREATE"
          fi
          aws cloudformation create-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name" \
            --change-set-type "$change_set_type" \
            --template-body file://infra/operations-pause-policy.yaml \
            --capabilities CAPABILITY_NAMED_IAM
          aws cloudformation wait change-set-create-complete \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name"
          aws cloudformation describe-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name" \
            --query '{Status:Status,ExecutionStatus:ExecutionStatus,Changes:Changes[].ResourceChange.{Action:Action,LogicalId:LogicalResourceId,Type:ResourceType,Replacement:Replacement}}'
          echo "Policy Change Set: $change_set_name" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute reviewed pause policy Change Set
        if: inputs.operation == 'execute-policy-change-set'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be the create-policy run ID" >&2
            exit 1
          fi
          stack_name="github-account-info-operations-pause-policy"
          change_set_name="pause-policy-${SOURCE_RUN_ID}"
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          aws cloudformation execute-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name"
          if [[ "$stack_status" == "REVIEW_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete --stack-name "$stack_name"
          else
            aws cloudformation wait stack-update-complete --stack-name "$stack_name"
          fi

      - name: Create reviewed runtime Change Sets
        if: inputs.operation == 'create-runtime-change-sets'
        shell: bash
        run: |
          set -euo pipefail

          create_pause_change_set() {
            local stack_name="$1"
            local change_set_name="$2"
            local output_file="$3"
            local jq_filter="$4"
            local template_mode="$5"
            local template_arguments=(--use-previous-template)

            if [[ "$template_mode" == "production" ]]; then
              template_arguments=(--template-body file://infra/go-production.yaml)
            fi

            aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query 'Stacks[0].Parameters' \
              --output json |
              jq --arg desired "0" "$jq_filter" > "$output_file"

            aws cloudformation create-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --change-set-type UPDATE \
              "${template_arguments[@]}" \
              --parameters "file://${output_file}" \
              --capabilities CAPABILITY_NAMED_IAM
            if ! aws cloudformation wait change-set-create-complete \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name"; then
              change_set_status="$(aws cloudformation describe-change-set \
                --stack-name "$stack_name" \
                --change-set-name "$change_set_name" \
                --query Status \
                --output text)"
              change_set_reason="$(aws cloudformation describe-change-set \
                --stack-name "$stack_name" \
                --change-set-name "$change_set_name" \
                --query StatusReason \
                --output text)"
              if [[ "$change_set_status" == "FAILED" && "$change_set_reason" == *"didn't contain changes"* ]]; then
                echo "$stack_name is already paused; no Change Set is required."
                aws cloudformation delete-change-set \
                  --stack-name "$stack_name" \
                  --change-set-name "$change_set_name"
                return 0
              fi
              echo "Change Set failed: $change_set_reason" >&2
              return 1
            fi
            aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --query '{Status:Status,ExecutionStatus:ExecutionStatus,Changes:Changes[].ResourceChange.{Action:Action,LogicalId:LogicalResourceId,Type:ResourceType,Replacement:Replacement}}'
          }

          create_pause_change_set \
            github-account-info-go-production \
            "pause-production-${GITHUB_RUN_ID}" \
            /tmp/production-parameters.json \
            'map(if .ParameterKey == "DesiredCount" or .ParameterKey == "CanaryDesiredCount" then .ParameterValue = $desired elif .ParameterKey == "StableTrafficWeight" then .ParameterValue = "100" elif .ParameterKey == "CanaryTrafficWeight" then .ParameterValue = "0" else . end)' \
            production

          create_pause_change_set \
            github-account-info-performance \
            "pause-performance-${GITHUB_RUN_ID}" \
            /tmp/performance-parameters.json \
            'map(if .ParameterKey == "DesiredCount" then .ParameterValue = $desired else . end)' \
            previous

          for pr_number in 27 30 31 32 39; do
            stack_name="github-account-info-go-pr-${pr_number}"
            if aws cloudformation describe-stacks --stack-name "$stack_name" >/dev/null 2>&1; then
              create_pause_change_set \
                "$stack_name" \
                "pause-preview-${pr_number}-${GITHUB_RUN_ID}" \
                "/tmp/preview-${pr_number}-parameters.json" \
                'map(if .ParameterKey == "DesiredCount" then .ParameterValue = $desired else . end)' \
                previous
            fi
          done

          echo "Runtime Change Set run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Review production, performance, and all preview Change Sets before execution." >> "$GITHUB_STEP_SUMMARY"

      - name: Recover Performance Stack rollback
        if: inputs.operation == 'recover-performance-rollback'
        shell: bash
        run: |
          set -euo pipefail
          stack_name="github-account-info-performance"
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query 'Stacks[0].StackStatus' \
            --output text)"

          if [[ "$stack_status" == "UPDATE_ROLLBACK_FAILED" ]]; then
            aws cloudformation continue-update-rollback --stack-name "$stack_name"
          elif [[ "$stack_status" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "Performance Stack rollback is already complete."
            exit 0
          else
            echo "Performance Stack is not recoverable from its current state: $stack_status" >&2
            exit 1
          fi

          for attempt in {1..40}; do
            stack_status="$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query 'Stacks[0].StackStatus' \
              --output text)"
            if [[ "$stack_status" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
              echo "Performance Stack rollback recovered successfully."
              exit 0
            fi
            echo "Waiting for Performance Stack rollback: $stack_status"
            sleep 15
          done

          echo "Performance Stack rollback recovery timed out; current state: $stack_status" >&2
          exit 1

      - name: Execute reviewed runtime pause
        if: inputs.operation == 'execute-runtime-pause'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be the create-runtime run ID" >&2
            exit 1
          fi

          execute_update() {
            local stack_name="$1"
            local change_set_name="$2"
            if ! aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" >/dev/null 2>&1; then
              nonzero_desired_count="$(aws cloudformation describe-stacks \
                --stack-name "$stack_name" \
                --query 'Stacks[0].Parameters[?contains(ParameterKey, `DesiredCount`) && ParameterValue != `0`].ParameterKey' \
                --output text)"
              if [[ -z "$nonzero_desired_count" || "$nonzero_desired_count" == "None" ]]; then
                echo "$stack_name is already paused; skipping execution."
                return 0
              fi
              echo "Missing Change Set for an active Stack: $stack_name" >&2
              return 1
            fi
            aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --query '{Status:Status,ExecutionStatus:ExecutionStatus}'
            aws cloudformation execute-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name"
            aws cloudformation wait stack-update-complete --stack-name "$stack_name"
          }

          aws cloudwatch disable-alarm-actions \
            --alarm-names \
              github-account-info-performance-queue-scale-out \
              github-account-info-performance-queue-scale-in

          execute_update \
            github-account-info-go-production \
            "pause-production-${SOURCE_RUN_ID}"
          execute_update \
            github-account-info-performance \
            "pause-performance-${SOURCE_RUN_ID}"
          for pr_number in 27 30 31 32 39; do
            stack_name="github-account-info-go-pr-${pr_number}"
            change_set_name="pause-preview-${pr_number}-${SOURCE_RUN_ID}"
            if aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" >/dev/null 2>&1; then
              execute_update "$stack_name" "$change_set_name"
            fi
          done

          instance_state="$(aws ec2 describe-instances \
            --instance-ids i-0fe5bdd02a913b64a \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          if [[ "$instance_state" == "running" || "$instance_state" == "pending" ]]; then
            aws ec2 stop-instances --instance-ids i-0fe5bdd02a913b64a >/dev/null
          fi
          aws ec2 wait instance-stopped --instance-ids i-0fe5bdd02a913b64a

          db_state="$(aws rds describe-db-instances \
            --db-instance-identifier github-account-info-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)"
          if [[ "$db_state" == "available" ]]; then
            aws rds stop-db-instance \
              --db-instance-identifier github-account-info-db >/dev/null
          fi
          for attempt in {1..60}; do
            db_state="$(aws rds describe-db-instances \
              --db-instance-identifier github-account-info-db \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text)"
            if [[ "$db_state" == "stopped" ]]; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "RDS did not stop; current state: $db_state" >&2
              exit 1
            fi
            sleep 15
          done

          aws ecs describe-services \
            --cluster github-account-info-go \
            --services \
              github-account-info-go-production \
              github-account-info-go-production-canary \
              github-account-info-performance \
              github-account-info-go-pr-27 \
              github-account-info-go-pr-30 \
              github-account-info-go-pr-31 \
              github-account-info-go-pr-32 \
              github-account-info-go-pr-39 \
            --query 'services[].{Name:serviceName,Desired:desiredCount,Running:runningCount}'
          echo "Runtime pause completed." >> "$GITHUB_STEP_SUMMARY"
