name: Deploy Lambda

# 这是 Node Lambda 的 SAM 部署入口。只有 master 上与 server/API/DB/env 相关的
# 文件变化才自动运行；workflow_dispatch 允许在 GitHub Actions 页面手动触发。
on:
  push:
    branches: [master]
    paths:
      - "apps/server/**"
      - "packages/api/**"
      - "packages/db/**"
      - "packages/env/**"
      - "packages/events/**"
      - "packages/performance-schema/**"
  workflow_dispatch:

permissions:
  # id-token: write 用于 GitHub OIDC 换取 AWS 临时凭证，不保存长期 Access Key。
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lambda
        # SAM 的 CodeUri 指向 dist/，所以必须先生成 Lambda bundle。
        run: node build.mjs
        working-directory: apps/server

      - name: Configure AWS credentials
        # configure-aws-credentials 通过 OIDC AssumeRole，凭证只在当前 Job 有效。
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::879980498268:role/github-actions-deployer
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v3

      - name: Deploy Lambda
        env:
          # 数据库连接串继续来自 Secret；Topic ARN 不是凭证，使用 repository Variable。
          # 两者通过 env 传给脚本，避免值出现在仓库或重复展开到命令文本中。
          DATABASE_URL: ${{ secrets.AWS_DATABASE_URL }}
          PROFILE_EVENTS_TOPIC_ARN: ${{ vars.PROFILE_EVENTS_TOPIC_ARN }}
        run: |
          # CloudFormation 只更新 $LATEST；公开 API 始终调用 live alias。
          # 脚本发布不可变版本并完成 90/10、5 分钟观察和 100% 晋级。
          chmod +x deploy-canary.sh
          ./deploy-canary.sh
        working-directory: apps/server
