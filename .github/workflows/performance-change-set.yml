name: Performance Change Set

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create/execute a reviewed Change Set or push the processor image
        required: true
        type: choice
        default: create-policy-change-set
        options:
          - create-policy-change-set
          - execute-policy-change-set
          - create-runtime-change-set
          - execute-runtime-change-set
          - push-image
          - migrate-database
      change_set_name:
        description: Required only when executing a reviewed Change Set
        required: false
        type: string
      desired_count:
        description: Runtime task count; keep 0 except during a short validation window
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      image_tag:
        description: Optional immutable prod-<git-sha>; defaults to the selected master commit
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  change-set:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::879980498268:role/github-actions-deployer
          aws-region: us-east-2

      - name: Verify non-root deployment identity
        shell: bash
        run: |
          set -euo pipefail
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"
          if [[ "$identity_arn" != *":assumed-role/github-actions-deployer/"* ]]; then
            echo "Unexpected deployment identity: $identity_arn" >&2
            exit 1
          fi

      - name: Resolve immutable image tag
        id: image
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image_tag="${REQUESTED_IMAGE_TAG:-prod-${GITHUB_SHA}}"
          if [[ ! "$image_tag" =~ ^prod-[0-9a-f]{7,40}$ ]]; then
            echo "image_tag must match prod-<7-to-40-lowercase-hex>" >&2
            exit 1
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Create deployer policy Change Set
        if: inputs.operation == 'create-policy-change-set'
        shell: bash
        run: |
          set -euo pipefail
          stack_name="github-account-info-performance-deployer-policy"
          change_set_name="performance-policy-${GITHUB_RUN_ID}"
          if aws cloudformation describe-stacks --stack-name "$stack_name" >/dev/null 2>&1; then
            change_set_type="UPDATE"
          else
            change_set_type="CREATE"
          fi
          aws cloudformation create-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name" \
            --change-set-type "$change_set_type" \
            --template-body file://infra/performance-deployer-policy.yaml \
            --capabilities CAPABILITY_NAMED_IAM
          aws cloudformation wait change-set-create-complete \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name"
          aws cloudformation describe-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name" \
            --query '{Status:Status,ExecutionStatus:ExecutionStatus,Changes:Changes[].ResourceChange.{Action:Action,LogicalId:LogicalResourceId,Type:ResourceType,Replacement:Replacement}}'
          echo "### Review before execution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stack: \`$stack_name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Change Set: \`$change_set_name\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute reviewed deployer policy Change Set
        if: inputs.operation == 'execute-policy-change-set'
        shell: bash
        env:
          CHANGE_SET_NAME: ${{ inputs.change_set_name }}
        run: |
          set -euo pipefail
          if [[ -z "$CHANGE_SET_NAME" ]]; then
            echo "change_set_name is required" >&2
            exit 1
          fi
          stack_name="github-account-info-performance-deployer-policy"
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query "Stacks[0].StackStatus" \
            --output text)"
          aws cloudformation execute-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$CHANGE_SET_NAME"
          if [[ "$stack_status" == "REVIEW_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete --stack-name "$stack_name"
          else
            aws cloudformation wait stack-update-complete --stack-name "$stack_name"
          fi

      - name: Create runtime Change Set
        if: inputs.operation == 'create-runtime-change-set'
        shell: bash
        env:
          DESIRED_COUNT: ${{ inputs.desired_count }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          stack_name="github-account-info-performance"
          change_set_name="performance-runtime-${GITHUB_RUN_ID}"
          if aws cloudformation describe-stacks --stack-name "$stack_name" >/dev/null 2>&1; then
            change_set_type="UPDATE"
          else
            change_set_type="CREATE"
            if [[ "$DESIRED_COUNT" != "0" ]]; then
              echo "The first CREATE must use desired_count=0" >&2
              exit 1
            fi
          fi
          aws cloudformation create-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name" \
            --change-set-type "$change_set_type" \
            --template-body file://infra/performance.yaml \
            --parameters \
              ParameterKey=ImageTag,ParameterValue="$IMAGE_TAG" \
              ParameterKey=DesiredCount,ParameterValue="$DESIRED_COUNT" \
            --capabilities CAPABILITY_NAMED_IAM
          aws cloudformation wait change-set-create-complete \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name"
          aws cloudformation describe-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$change_set_name" \
            --query '{Status:Status,ExecutionStatus:ExecutionStatus,Parameters:Parameters,Changes:Changes[].ResourceChange.{Action:Action,LogicalId:LogicalResourceId,Type:ResourceType,Replacement:Replacement}}'
          echo "### Review before execution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stack: \`$stack_name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Change Set: \`$change_set_name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- DesiredCount: \`$DESIRED_COUNT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute reviewed runtime Change Set
        if: inputs.operation == 'execute-runtime-change-set'
        shell: bash
        env:
          CHANGE_SET_NAME: ${{ inputs.change_set_name }}
        run: |
          set -euo pipefail
          if [[ -z "$CHANGE_SET_NAME" ]]; then
            echo "change_set_name is required" >&2
            exit 1
          fi
          stack_name="github-account-info-performance"
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query "Stacks[0].StackStatus" \
            --output text)"
          aws cloudformation execute-change-set \
            --stack-name "$stack_name" \
            --change-set-name "$CHANGE_SET_NAME"
          if [[ "$stack_status" == "REVIEW_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete --stack-name "$stack_name"
          else
            aws cloudformation wait stack-update-complete --stack-name "$stack_name"
          fi

      - uses: pnpm/action-setup@v6
        if: inputs.operation == 'push-image'
        with:
          version: 10.24.0

      - uses: actions/setup-node@v7
        if: inputs.operation == 'push-image'
        with:
          node-version: 22
          cache: pnpm

      - name: Test and build processor
        if: inputs.operation == 'push-image'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter performance-processor check-types
          pnpm --filter performance-processor test
          pnpm --filter performance-processor build

      - name: Push immutable processor image
        if: inputs.operation == 'push-image'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          repository_uri="$(aws cloudformation describe-stacks \
            --stack-name github-account-info-performance \
            --query "Stacks[0].Outputs[?OutputKey=='PerformanceRepositoryUri'].OutputValue | [0]" \
            --output text)"
          if [[ -z "$repository_uri" || "$repository_uri" == "None" ]]; then
            echo "Performance repository output is unavailable" >&2
            exit 1
          fi
          registry="${repository_uri%%/*}"
          aws ecr get-login-password |
            docker login --username AWS --password-stdin "$registry"
          docker build \
            --file apps/performance-processor/Dockerfile \
            --tag "${repository_uri}:${IMAGE_TAG}" \
            .
          docker push "${repository_uri}:${IMAGE_TAG}"
          aws ecr describe-images \
            --repository-name github-account-info-performance \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt,Size:imageSizeInBytes}'
          echo "Pushed \`${repository_uri}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run one-off database migration task
        if: inputs.operation == 'migrate-database'
        shell: bash
        run: |
          set -euo pipefail
          readonly cluster_name="github-account-info-go"
          readonly service_name="github-account-info-performance"
          task_arn=""

          cleanup() {
            if [[ -z "$task_arn" ]]; then
              return
            fi
            task_status="$(aws ecs describe-tasks \
              --cluster "$cluster_name" \
              --tasks "$task_arn" \
              --query 'tasks[0].lastStatus' \
              --output text 2>/dev/null || true)"
            if [[ "$task_status" == "PENDING" || "$task_status" == "RUNNING" ]]; then
              aws ecs stop-task \
                --cluster "$cluster_name" \
                --task "$task_arn" \
                --reason "Migration workflow cleanup" >/dev/null
            fi
          }
          trap cleanup EXIT INT TERM

          service_json="$(aws ecs describe-services \
            --cluster "$cluster_name" \
            --services "$service_name" \
            --query 'services[0]' \
            --output json)"
          task_definition="$(jq -r '.taskDefinition' <<< "$service_json")"
          network_configuration="$(jq -c \
            '{awsvpcConfiguration: .networkConfiguration.awsvpcConfiguration}' \
            <<< "$service_json")"

          if [[ -z "$task_definition" || "$task_definition" == "null" ]]; then
            echo "Performance task definition is unavailable" >&2
            exit 1
          fi

          task_arn="$(aws ecs run-task \
            --cluster "$cluster_name" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --count 1 \
            --started-by "perf-migrate-${GITHUB_RUN_ID}" \
            --network-configuration "$network_configuration" \
            --overrides \
              '{"containerOverrides":[{"name":"performance-processor","environment":[{"name":"PERFORMANCE_PROCESSOR_MODE","value":"migrate"}]}]}' \
            --tags \
              key=Project,value=github-account-info-performance \
              key=Purpose,value=database-migration \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "AWS did not start the migration task" >&2
            exit 1
          fi

          aws ecs wait tasks-stopped \
            --cluster "$cluster_name" \
            --tasks "$task_arn"

          exit_code="$(aws ecs describe-tasks \
            --cluster "$cluster_name" \
            --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='performance-processor'].exitCode | [0]" \
            --output text)"
          stopped_reason="$(aws ecs describe-tasks \
            --cluster "$cluster_name" \
            --tasks "$task_arn" \
            --query 'tasks[0].stoppedReason' \
            --output text)"

          if [[ "$exit_code" != "0" ]]; then
            echo "Migration task failed with exit code $exit_code: $stopped_reason" >&2
            exit 1
          fi

          echo "### Database migration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Task: \`$task_arn\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: \`0\`" >> "$GITHUB_STEP_SUMMARY"
