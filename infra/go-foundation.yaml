# Go 平台的“长期共享基础设施”Stack。它负责 ECR、ECS Cluster、Cloud Map、
# 安全组和 Internal ALB；production 与每个 PR preview Stack 都复用这些资源。
# 把生命周期较长的资源单独拆栈，可以避免发布业务版本时误删网络和镜像仓库。
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Shared runtime foundation for the github-account-info Go API: ECR, ECS
  cluster, Cloud Map private DNS, internal ALB, network boundaries, and logs.
  IAM roles live in the dependent go-iam.yaml stack.

# 本文件内置函数阅读提示：
# - !Ref ProjectName/VpcId 返回参数值；!Ref GoRepository 返回 ECR 仓库名，
#   !Ref GoCluster 返回 Cluster 名。Resource 的 Ref 返回什么取决于资源类型。
# - !Sub ${ProjectName}-internal 把参数插入字符串；${AWS::Region} 是伪参数。
# - !GetAtt GoRepository.Arn 明确读取 ARN；Ref 通常只返回名称或 ID。
# - !Join [",", !Ref PrivateSubnetIds] 把 List 拼成可 Export 的字符串。
# - Outputs.Export.Name 定义跨 Stack 契约，使用方通过 Fn::ImportValue 读取。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ProjectName
          - CloudMapNamespaceName
          - CloudMapServiceName
      - Label:
          default: Existing VPC resources
        Parameters:
          - VpcId
          - PrivateSubnetIds
          - LambdaSecurityGroupId
          - RdsSecurityGroupId
      - Label:
          default: Retention
        Parameters:
          - EcsLogRetentionDays
    ParameterLabels:
      PrivateSubnetIds:
        default: Private subnets in at least two Availability Zones

Parameters:
  # Parameters 中的 VPC、Subnet、Lambda/RDS Security Group 都是现有资源 ID；
  # 本 Stack 引用它们但不拥有它们，因此删除本 Stack 不会删除原有 VPC/RDS。
  ProjectName:
    Type: String
    Default: github-account-info-go
    MinLength: 3
    MaxLength: 22
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
    ConstraintDescription: >-
      Use 3-22 lowercase letters, digits, and hyphens, starting with a letter
      and ending with a letter or digit.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC containing Lambda, private subnets, and RDS.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two private subnet IDs in distinct Availability Zones. The
      internal ALB and later Fargate services use these subnets.
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing security group attached to the Node Lambda.
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing security group attached to the production RDS instance.
  CloudMapNamespaceName:
    Type: String
    Default: github-account-info.local
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
  CloudMapServiceName:
    Type: String
    Default: go-api
    AllowedPattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
  EcsLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 180
      - 365

Resources:
  # ECR 镜像仓库。Retain 双保险确保删除/替换 Stack 时镜像仍保留；
  # LifecyclePolicy 负责自动回收无 tag 和过旧 preview 镜像，控制存储成本。
  GoRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # !Ref 引用 Parameter，所以结果就是部署时 ProjectName 的字符串值。
      RepositoryName: !Ref ProjectName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the newest 30 production images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["prod-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Expire PR images after 14 days as a cleanup fallback",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["pr-"],
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 3,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  GoEcsLogGroup:
    # 所有 Go ECS Task 共用的 CloudWatch Logs 日志组。日志组被 Retain，
    # RetentionInDays 则限定每条日志的保留时间，两者解决的是不同问题。
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}
      RetentionInDays: !Ref EcsLogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  GoCluster:
    # ECS Cluster 是 Fargate Service/Task 的逻辑容器，本身不创建 EC2 主机。
    # Container Insights 打开后可获得更细的 CPU、内存和任务级监控指标。
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: 1
          Weight: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  CloudMapNamespace:
    # PrivateDnsNamespace 会在指定 VPC 内建立私有 DNS 命名空间；公网无法解析。
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref CloudMapNamespaceName
      Description: Private DNS namespace for github-account-info services
      Vpc: !Ref VpcId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  GoCloudMapService:
    # ECS Service 会把 Task 私有 IP 注册到该 Cloud Map Service。
    # Node Lambda 通过稳定 DNS 名访问 Go，而不依赖会变化的 Task IP。
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CloudMapServiceName
      Description: Direct private discovery for Go ECS tasks
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig: {}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  GoTaskSecurityGroup:
    # Go Task 的安全边界：本资源只声明出站规则；入站规则拆成独立资源，
    # 可以清楚表达“谁能访问 Go”，也能减少安全组之间的循环依赖。
    Type: AWS::EC2::SecurityGroup
    Properties:
      # !Sub 解析 ${ProjectName} 后生成描述文本，不会创建额外资源。
      GroupDescription: !Sub ${ProjectName} Fargate task boundary
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: PostgreSQL to the existing RDS security group
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RdsSecurityGroupId
        - Description: HTTPS to AWS APIs through existing NAT or VPC endpoints
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-task-sg
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  InternalAlbSecurityGroup:
    # Internal ALB 专用安全组。ALB 只接收 VPC Link 流量，并只向 Go Task
    # 的 8080 端口转发，不允许任意公网来源直接访问。
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName} internal ALB boundary
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: Forward traffic and health checks to Go tasks
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !GetAtt GoTaskSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-internal-alb-sg
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  VpcLinkSecurityGroup:
    # API Gateway VPC Link 使用的安全组；它只需向 Internal ALB 的 80 端口出站。
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName} API Gateway VPC Link boundary
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTP to the internal ALB listener only
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          DestinationSecurityGroupId: !GetAtt InternalAlbSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc-link-sg
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  AlbIngressFromVpcLink:
    # “来源安全组 → 目标安全组”的显式规则比 CIDR 更稳定：子网网段变化时
    # 无需修改规则。这里只允许 VPC Link 到 ALB:80。
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: API Gateway VPC Link to internal ALB
      # !GetAtt 明确读取安全组的 GroupId 属性；属性名由资源文档定义。
      GroupId: !GetAtt InternalAlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !GetAtt VpcLinkSecurityGroup.GroupId

  GoIngressFromAlb:
    # 允许 ALB 到 Go Task:8080，承载公网只读请求的私网后半段。
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Internal ALB forwarding and health checks
      GroupId: !GetAtt GoTaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !GetAtt InternalAlbSecurityGroup.GroupId

  GoIngressFromLambda:
    # 允许现有 Node Lambda 到 Go Task:8080，用于 /internal/v1/* 内部写接口。
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Node Lambda direct calls through Cloud Map DNS
      GroupId: !GetAtt GoTaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LambdaSecurityGroupId

  RdsIngressFromGo:
    # 在现有 RDS 安全组上增加入站规则，只允许 Go Task 访问 PostgreSQL 5432。
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Go ECS tasks to PostgreSQL
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt GoTaskSecurityGroup.GroupId

  InternalLoadBalancer:
    # scheme=internal 表示 ALB 只分配私网地址；放在至少两个私有子网中
    # 提供跨可用区能力。它不是公网入口，API Gateway 才是公网边界。
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-internal
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !GetAtt InternalAlbSecurityGroup.GroupId
      Subnets: !Ref PrivateSubnetIds
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.desync_mitigation_mode
          # API Gateway HTTP API private integrations can be classified as
          # non-compliant by ALB strictest mode and receive an ALB-generated 400.
          Value: defensive
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  InternalHttpListener:
    # 共享 HTTP Listener 本身只有固定 404；production/preview Stack 通过
    # ListenerRule 按路径增加转发规则，从而共享一个 ALB。
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":{"code":"route_not_configured","message":"no backend route is configured"}}'
            StatusCode: "404"


Outputs:
  # foundation 是跨 Stack 的“提供方”。带 Export.Name 的输出可被其他模板
  # 通过 Fn::ImportValue 引用；只要仍被引用，CloudFormation 就会阻止删除
  # 或修改该 Export，形成部署顺序保护。
  VpcId:
    Description: Existing VPC used by the platform.
    Value: !Ref VpcId
    Export:
      Name: !Sub ${ProjectName}-VpcId
  PrivateSubnetIds:
    Description: Comma-delimited private subnet IDs.
    # Export 需要简单值，所以先把 List 拼成 "subnet-a,subnet-b" 字符串；
    # 使用方再用 !Split 还原成 List。
    Value: !Join [",", !Ref PrivateSubnetIds]
    Export:
      Name: !Sub ${ProjectName}-PrivateSubnetIds
  EcrRepositoryName:
    Value: !Ref GoRepository
    Export:
      Name: !Sub ${ProjectName}-EcrRepositoryName
  EcrRepositoryArn:
    Value: !GetAtt GoRepository.Arn
    Export:
      Name: !Sub ${ProjectName}-EcrRepositoryArn
  EcrRepositoryUri:
    Value: !GetAtt GoRepository.RepositoryUri
    Export:
      Name: !Sub ${ProjectName}-EcrRepositoryUri
  EcsClusterName:
    Value: !Ref GoCluster
    Export:
      Name: !Sub ${ProjectName}-EcsClusterName
  EcsClusterArn:
    Value: !GetAtt GoCluster.Arn
    Export:
      Name: !Sub ${ProjectName}-EcsClusterArn
  EcsLogGroupName:
    Value: !Ref GoEcsLogGroup
    Export:
      Name: !Sub ${ProjectName}-EcsLogGroupName
  EcsLogGroupArn:
    Value: !GetAtt GoEcsLogGroup.Arn
    Export:
      Name: !Sub ${ProjectName}-EcsLogGroupArn
  CloudMapNamespaceId:
    Value: !Ref CloudMapNamespace
    Export:
      Name: !Sub ${ProjectName}-CloudMapNamespaceId
  CloudMapServiceArn:
    Value: !GetAtt GoCloudMapService.Arn
    Export:
      Name: !Sub ${ProjectName}-CloudMapServiceArn
  CloudMapServiceDnsName:
    Value: !Sub ${CloudMapServiceName}.${CloudMapNamespaceName}
    Export:
      Name: !Sub ${ProjectName}-CloudMapServiceDnsName
  InternalLoadBalancerArn:
    Value: !Ref InternalLoadBalancer
    Export:
      Name: !Sub ${ProjectName}-InternalLoadBalancerArn
  InternalLoadBalancerDnsName:
    Value: !GetAtt InternalLoadBalancer.DNSName
    Export:
      Name: !Sub ${ProjectName}-InternalLoadBalancerDnsName
  InternalLoadBalancerFullName:
    Description: CloudWatch dimension value for the internal ALB.
    Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub ${ProjectName}-InternalLoadBalancerFullName
  InternalHttpListenerArn:
    Value: !Ref InternalHttpListener
    Export:
      Name: !Sub ${ProjectName}-InternalHttpListenerArn
  GoTaskSecurityGroupId:
    Value: !GetAtt GoTaskSecurityGroup.GroupId
    Export:
      Name: !Sub ${ProjectName}-GoTaskSecurityGroupId
  VpcLinkSecurityGroupId:
    Value: !GetAtt VpcLinkSecurityGroup.GroupId
    Export:
      Name: !Sub ${ProjectName}-VpcLinkSecurityGroupId
