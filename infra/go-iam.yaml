# Go 平台的 IAM 权限 Stack。这里把 runtime execution role 与 CI/CD role 分开：
# ECS Execution Role 只负责“启动 Task 前”拉镜像、写日志、取 Secret；应用容器
# 本身没有 AWS API 权限。CodeBuild Role 才负责部署 CloudFormation/ECS/ALB。
# production 和 preview 再使用不同角色，防止 preview 读取生产数据库 Secret。
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Four isolated IAM roles for the github-account-info Go platform:
  production/preview ECS task execution and production/preview CodeBuild.
  This stack depends on exports from go-foundation.yaml. Go containers call no
  AWS APIs and intentionally have no task role.

# 本文件内置函数阅读提示：
# - !Ref SecretArnParameter 返回传入的 ARN；!Ref IAM Role 返回角色名称。
# - !GetAtt Role.Arn 返回完整角色 ARN，是 ECS/CodeBuild 配置角色时需要的值。
# - !Sub 负责拼角色名和 ARN，其中 AWS::Partition/Region/AccountId 是伪参数。
# - Fn::ImportValue 读取 foundation Stack 的 Export，例如 ECR/LogGroup ARN。
# - !If [HasKey, statement, !Ref AWS::NoValue] 表示仅使用自定义 KMS Key 时
#   才保留该 Statement；AWS::NoValue 会把整段从最终策略移除。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ProjectName
      - Label:
          default: Existing database secrets
        Parameters:
          - DatabaseUrlSecretArn
          - DatabaseSecretKmsKeyArn
          - PreviewDatabaseUrlSecretArn
          - PreviewDatabaseSecretKmsKeyArn
    ParameterLabels:
      DatabaseUrlSecretArn:
        default: Production DATABASE_URL Secret ARN
      PreviewDatabaseUrlSecretArn:
        default: Preview-only DATABASE_URL Secret ARN

Parameters:
  # Secret ARN 作为参数传入，模板只保存 ARN，不保存数据库连接串本身。
  # KMS Key ARN 可留空：使用 Secrets Manager 默认托管密钥时无需额外解密授权。
  ProjectName:
    Type: String
    Default: github-account-info-go
    MinLength: 3
    MaxLength: 22
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  DatabaseUrlSecretArn:
    Type: String
    Description: >-
      ARN of an existing Secrets Manager secret whose entire SecretString is
      the production PostgreSQL DATABASE_URL. Never pass its value here.
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
  DatabaseSecretKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty for aws/secretsmanager; otherwise enter the customer-managed
      KMS key ARN used by the production secret.
  PreviewDatabaseUrlSecretArn:
    Type: String
    Description: >-
      ARN of the separate preview-only PostgreSQL DATABASE_URL secret.
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
  PreviewDatabaseSecretKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty for aws/secretsmanager; otherwise enter the customer-managed
      KMS key ARN used by the preview secret.

Conditions:
  # 条件用于判断是否传入自定义 KMS Key。为 false 时，!If 返回
  # AWS::NoValue，CloudFormation 会从最终资源定义中移除对应 policy statement。
  HasDatabaseSecretKmsKey: !Not
    - !Equals
      - !Ref DatabaseSecretKmsKeyArn
      - ""
  HasPreviewDatabaseSecretKmsKey: !Not
    - !Equals
      - !Ref PreviewDatabaseSecretKmsKeyArn
      - ""

Resources:
  # production ECS Task Execution Role。AssumeRolePolicyDocument 是“信任策略”，
  # 决定谁能扮演角色；下面的 Policies 是“权限策略”，决定扮演后能做什么。
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      # !Sub 把 ProjectName 参数嵌入角色名；名称变化可能触发 IAM Role 替换。
      RoleName: !Sub ${ProjectName}-execution-role
      Path: /github-account-info/
      Description: Pulls the Go image, writes logs, and injects the database secret.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      # 权限按用途拆分，便于审计：ECR/Logs 与 Secret/KMS 不混在一起。
      Policies:
        - PolicyName: pull-image-and-write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullOnlyFromProjectRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  # ImportValue 的参数是 foundation Stack 发布的 Export 名；
                  # 内层 !Sub 先把 ProjectName 拼进这个 Export 名。
                  Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryArn
              - Sid: WriteOnlyToProjectLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # AWS::Logs::LogGroup.Arn already ends in `:*`.
                Resource:
                  Fn::ImportValue: !Sub ${ProjectName}-EcsLogGroupArn
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyDatabaseUrlSecret
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseUrlSecretArn
              - !If
                # !If 列表依次为 Condition、true 分支、false 分支；false 时
                # AWS::NoValue 删除整个 KMS Statement，而不是留下空 Resource。
                - HasDatabaseSecretKmsKey
                - Sid: DecryptDatabaseSecret
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref DatabaseSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}
                - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Scope
          Value: shared
        - Key: ManagedBy
          Value: cloudformation

  PreviewEcsTaskExecutionRole:
    # preview 专用 Execution Role。它只能读取 preview Secret，刻意不授予
    # production Secret ARN，从 IAM 层阻断预览环境读取生产数据。
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-preview-execution-role
      Path: /github-account-info/
      Description: >-
        Pulls preview images, writes preview logs, and can inject only the
        preview database secret. It cannot read the production database secret.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      # 与 production 使用同一个 ECR/日志基础设施，但数据库凭证严格分离。
      Policies:
        - PolicyName: pull-preview-image-and-write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullOnlyFromProjectRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryArn
              - Sid: WriteOnlyToProjectLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::ImportValue: !Sub ${ProjectName}-EcsLogGroupArn
        - PolicyName: read-preview-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyPreviewDatabaseUrlSecret
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Ref PreviewDatabaseUrlSecretArn
              - !If
                - HasPreviewDatabaseSecretKmsKey
                - Sid: DecryptPreviewDatabaseSecret
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref PreviewDatabaseSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}
                - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: cloudformation

  CodeBuildRole:
    # production CodeBuild Role：允许构建/推送镜像，并只管理 production
    # CloudFormation Stack、ECS Service、Target Group 和 Listener Rule。
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-production-codebuild-role
      Path: /github-account-info/
      Description: Builds immutable production images and deploys only the production stack.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-production
      # 每个 Statement 都尽量限制 Resource；iam:PassRole 还通过
      # iam:PassedToService 限定只能把 Execution Role 交给 ECS Task。
      Policies:
        - PolicyName: build-logs-and-ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateOnlyProjectBuildLogGroups
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-production
              - Sid: WriteOnlyProjectBuildLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-production:log-stream:*
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyToProjectRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryArn
        - PolicyName: project-stack-deployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: ManageOnlyProductionStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-production/*
              - Sid: PassOnlyProductionExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EcsTaskExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: RegisterProductionTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: !Ref ProjectName
                    aws:RequestTag/Environment: production
              # DescribeTaskDefinition and DeregisterTaskDefinition do not
              # support resource-level permissions in ECS IAM.
              - Sid: ReadAndDeregisterTaskDefinitionsForDeployment
                Effect: Allow
                Action:
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: ReadProjectTaskDefinitionTags
                Effect: Allow
                Action: ecs:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-production*:*
              - Sid: ManageProductionService
                Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateService
                Resource:
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-production
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-production-canary
              - Sid: ObserveProjectTasks
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::ImportValue: !Sub ${ProjectName}-EcsClusterArn
              - Sid: ReadDeploymentNetwork
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: ReadDatabaseSecretMetadata
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Ref DatabaseUrlSecretArn
        - PolicyName: project-load-balancer-deployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeLoadBalancerResources
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"
              - Sid: CreateTaggedTargetGroups
                Effect: Allow
                Action: elasticloadbalancing:CreateTargetGroup
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: !Ref ProjectName
                    aws:RequestTag/Environment: production
              - Sid: ManageProjectTargetGroups
                Effect: Allow
                Action:
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:RemoveTags
                Resource: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/${ProjectName}-prod*/*
              - Sid: ManageRulesOnProjectListener
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:ModifyRule
                  - elasticloadbalancing:SetRulePriorities
                Resource:
                  - Fn::ImportValue: !Sub ${ProjectName}-InternalHttpListenerArn
                  - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/${ProjectName}-internal/*/*/*
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation

  PreviewCodeBuildRole:
    # preview CodeBuild Role 同时被 PR webhook build 和定时 TTL cleanup 使用。
    # ARN 通配符只覆盖 pr-* 资源，避免它修改 production Stack/Service。
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-preview-codebuild-role
      Path: /github-account-info/
      Description: >-
        Builds PR images and manages only pr-* CloudFormation, ECS, and ALB
        resources. It cannot pass the production execution role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PreviewCodeBuildProjects
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-preview
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-preview-ttl-cleanup
          - Sid: ScheduledPreviewCleanupRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}-preview-ttl-cleanup
      # SourceArn 信任条件把普通 preview 项目和 EventBridge 定时任务都限制在
      # 当前账户的精确 ARN；下面权限还按日志、ECR、CFN/ECS、ALB 分组。
      Policies:
        - PolicyName: preview-build-logs-and-ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreatePreviewBuildLogGroup
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-preview
              - Sid: WritePreviewBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-preview:log-stream:*
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyToProjectRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryArn
        - PolicyName: preview-stack-deployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: ManageOnlyPreviewStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-pr-*/*
              - Sid: PassOnlyPreviewExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt PreviewEcsTaskExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: RegisterPreviewTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: !Ref ProjectName
                    aws:RequestTag/Environment: preview
              - Sid: ReadTaskDefinitionsForPreview
                Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: ReadPreviewTaskDefinitionTags
                Effect: Allow
                Action: ecs:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-pr-*:*
              - Sid: ManagePreviewServices
                Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateService
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-pr-*
              - Sid: RunPreviewDatabaseTasks
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-pr-*:*
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::ImportValue: !Sub ${ProjectName}-EcsClusterArn
              - Sid: ObservePreviewTasks
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::ImportValue: !Sub ${ProjectName}-EcsClusterArn
              - Sid: ReadDeploymentNetwork
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: ReadPreviewDatabaseSecretMetadata
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Ref PreviewDatabaseUrlSecretArn
        - PolicyName: preview-load-balancer-deployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeLoadBalancerResources
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"
              - Sid: CreateTaggedPreviewTargetGroups
                Effect: Allow
                Action: elasticloadbalancing:CreateTargetGroup
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: !Ref ProjectName
                    aws:RequestTag/Environment: preview
              - Sid: ManagePreviewTargetGroups
                Effect: Allow
                Action:
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:RemoveTags
                Resource: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/${ProjectName}-pr-*/*
              - Sid: ManagePreviewRulesOnProjectListener
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:ModifyRule
                  - elasticloadbalancing:SetRulePriorities
                Resource:
                  - Fn::ImportValue: !Sub ${ProjectName}-InternalHttpListenerArn
                  - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/${ProjectName}-internal/*/*/*
        - PolicyName: scheduled-preview-cleanup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverOnlyTaggedPreviewStacks
                Effect: Allow
                Action: tag:GetResources
                Resource: "*"
              - Sid: StartAndObservePreviewCleanupBuilds
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-preview
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-preview-ttl-cleanup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  # 角色 ARN/名称和 Secret ARN 通过 Export 暴露给 foundation、production、
  # preview 与 codebuild Stack。输出的是标识符，不会泄露 Secret 内容。
  EcsTaskExecutionRoleArn:
    # !GetAtt 明确读取 Role.Arn；若写 !Ref EcsTaskExecutionRole 只会得到角色名。
    Value: !GetAtt EcsTaskExecutionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-EcsTaskExecutionRoleArn
  PreviewEcsTaskExecutionRoleArn:
    Value: !GetAtt PreviewEcsTaskExecutionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-PreviewEcsTaskExecutionRoleArn
  CodeBuildRoleArn:
    Value: !GetAtt CodeBuildRole.Arn
    Export:
      Name: !Sub ${ProjectName}-CodeBuildRoleArn
  CodeBuildRoleName:
    Value: !Ref CodeBuildRole
    Export:
      Name: !Sub ${ProjectName}-CodeBuildRoleName
  PreviewCodeBuildRoleArn:
    Value: !GetAtt PreviewCodeBuildRole.Arn
    Export:
