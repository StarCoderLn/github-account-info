# 单个 Pull Request 的临时预览 Stack。每个 PR 使用独立 TaskDefinition、
# TargetGroup、ListenerRule、ECS Service 和数据库 schema；Stack 名及资源名都
# 包含 PRNumber。关闭 PR 或超过 ExpiresAt 后由 cleanup 流水线删除。
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One isolated pull-request runtime for the github-account-info Go API. Reuses
  shared foundation resources but owns its ECS service, target group, listener
  rule, task definitions, and pr_<number> database schema lifecycle task.

# 本文件内置函数阅读提示：
# - !Ref PRNumber/ImageTag 返回参数值；!Ref TaskDefinition 返回带 revision 的 ARN。
# - !Sub ${ProjectName}-pr-${PRNumber} 可同时替换多个参数，生成 PR 专属名称。
# - Fn::ImportValue 读取共享 Stack 输出，本 Stack 不重复创建 Cluster/VPC/IAM。
# - !Equals 生成 CreateRouting 条件；资源上的 Condition 为 false 时资源不创建。
# - !GetAtt PreviewService.Name 获取 Service 的 Name 属性，而不是 Ref 主标识。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Pull request identity
        Parameters:
          - ProjectName
          - PRNumber
          - PreviewKey
          - ImageTag
          - ExpiresAt
      - Label:
          default: Runtime lifecycle
        Parameters:
          - DesiredCount
          - RoutingEnabled
          - CorsOrigins
          - CorsPreviewOriginSuffix

Parameters:
  # PRNumber 是资源隔离的根标识，只允许数字；PreviewKey 用于 URL 路径，
  # ExpiresAt 用于 TTL 清理。RoutingEnabled 允许先只运行数据库一次性任务，
  # 等 migration/seed 成功后再创建对外路由和常驻 Service。
  ProjectName:
    Type: String
    Default: github-account-info-go
    MinLength: 3
    MaxLength: 22
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  PRNumber:
    Type: Number
    MinValue: 1
    MaxValue: 49999
    Description: Also used as the unique ALB listener priority.
  PreviewKey:
    Type: String
    AllowedPattern: "^preview-[0-9a-f]{12}$"
    Description: Derived from the full head commit SHA by the shared preview-key module.
  ImageTag:
    Type: String
    AllowedPattern: "^pr-[1-9][0-9]{0,4}-[0-9a-f]{40}$"
    Description: Immutable pr-<number>-<full-lowercase-commit-sha> ECR tag.
  ExpiresAt:
    Type: String
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
    Description: UTC TTL tag used by the stage-11 cleanup fallback.
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues:
      - 0
      - 1
  RoutingEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set false together with DesiredCount=0 before schema cleanup.
  CorsOrigins:
    Type: String
    Default: https://github-account-info.pages.dev
    MinLength: 8
    MaxLength: 1024
  CorsPreviewOriginSuffix:
    Type: String
    Default: .github-account-info.pages.dev
    AllowedPattern: '^\.[a-z0-9][a-z0-9.-]*[a-z0-9]$'

Conditions:
  # CloudFormation Condition 在模板求值阶段决定资源是否存在，不是运行时 if。
  # !Equals 把字符串参数 "true" 转成 CreateRouting 布尔条件。
  CreateRouting: !Equals
    # !Equals 接收两个值并返回布尔值；!Ref 先取得 RoutingEnabled 参数字符串。
    - !Ref RoutingEnabled
    - "true"

Resources:
  # preview 运行时 TaskDefinition。Retain 防止 Stack 更新替换时立即注销旧 revision，
  # 方便排障；最终仍需由 TTL/PR cleanup 负责清理关联资源。
  PreviewTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # 一个 !Sub 中可放多个占位符，结果例如 github-account-info-go-pr-123。
      Family: !Sub ${ProjectName}-pr-${PRNumber}
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        # 使用 preview 专用 Execution Role，确保容器只能读取 preview 数据库 Secret。
        Fn::ImportValue: !Sub ${ProjectName}-PreviewEcsTaskExecutionRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: go-api
          Essential: true
          Image: !Join
            - ":"
            - - Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryUri
              - !Ref ImageTag
          User: "65532:65532"
          ReadonlyRootFilesystem: true
          StopTimeout: 15
          PortMappings:
            - Name: http
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
          Environment:
            # DB_SCHEMA 把同一 preview database 内的数据隔离到 pr_<number> schema。
            # 这是可信 PR 间的功能隔离，不等同于恶意多租户安全边界。
            - Name: APP_ENV
              Value: production
            - Name: PORT
              Value: "8080"
            - Name: DB_SCHEMA
              Value: !Sub pr_${PRNumber}
            - Name: RDS_CA_BUNDLE
              Value: /etc/ssl/certs/rds-us-east-2-bundle.pem
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: CORS_PREVIEW_ORIGIN_SUFFIX
              Value: !Ref CorsPreviewOriginSuffix
          Secrets:
            - Name: DATABASE_URL
              ValueFrom:
                Fn::ImportValue: !Sub ${ProjectName}-PreviewDatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${ProjectName}-EcsLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Sub pr-${PRNumber}
              mode: non-blocking
              max-buffer-size: 4m
          DockerLabels:
            com.github-account-info.project: !Ref ProjectName
            com.github-account-info.environment: preview
            com.github-account-info.pr-number: !Ref PRNumber
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: PRNumber
          Value: !Ref PRNumber
        - Key: PreviewKey
          Value: !Ref PreviewKey
        - Key: ImageTag
          Value: !Ref ImageTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAt
        - Key: ManagedBy
          Value: cloudformation

  PreviewDatabaseTaskDefinition:
    # 一次性数据库 Task：执行 create/drop schema、migration 和 seed，不启动 HTTP
    # Server。CodeBuild 用 RunTask 启动它并等待退出码，再决定是否创建路由。
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Family: !Sub ${ProjectName}-pr-${PRNumber}-db
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        Fn::ImportValue: !Sub ${ProjectName}-PreviewEcsTaskExecutionRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: preview-db
          Essential: true
          Image: !Join
            - ":"
            - - Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryUri
              - !Ref ImageTag
          EntryPoint:
            - /preview-db
          Command:
            - create
            - --pr-number
            - !Ref PRNumber
          User: "65532:65532"
          ReadonlyRootFilesystem: true
          Environment:
            - Name: RDS_CA_BUNDLE
              Value: /etc/ssl/certs/rds-us-east-2-bundle.pem
          Secrets:
            - Name: DATABASE_URL
              ValueFrom:
                Fn::ImportValue: !Sub ${ProjectName}-PreviewDatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${ProjectName}-EcsLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Sub pr-${PRNumber}-db
              mode: non-blocking
              max-buffer-size: 4m
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: PRNumber
          Value: !Ref PRNumber
        - Key: PreviewKey
          Value: !Ref PreviewKey
        - Key: ImageTag
          Value: !Ref ImageTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAt
        - Key: ManagedBy
          Value: cloudformation

  PreviewTargetGroup:
    # 每个 PR 独享 Target Group，避免不同 PR 的 Task 混合注册。
    # target-type=ip 对应 Fargate 的 awsvpc 网络模式。
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-pr-${PRNumber}
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-VpcId
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: 8080
      TargetType: ip
      IpAddressType: ipv4
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"
        - Key: stickiness.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: PRNumber
          Value: !Ref PRNumber
        - Key: PreviewKey
          Value: !Ref PreviewKey
        - Key: ImageTag
          Value: !Ref ImageTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAt
        - Key: ManagedBy
          Value: cloudformation

  PreviewListenerRule:
    # 只有 RoutingEnabled=true 才创建。优先级直接使用 PRNumber，因此同一 ALB
    # 上每个 PR 的规则天然唯一；路径中的 PreviewKey 防止和 production 冲突。
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    # Condition 是 CloudFormation 资源级开关，不是 ListenerRule 的运行时属性。
    Condition: CreateRouting
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub ${ProjectName}-InternalHttpListenerArn
      Priority: !Ref PRNumber
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Preview-Environment
            Values:
              - !Ref PreviewKey
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/v1/*
              - /healthz
              - /readyz
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PreviewTargetGroup

  PreviewService:
    # 同样受 CreateRouting 条件控制。数据库准备成功前 Stack 可以只包含 Task
    # Definition/Target Group，避免未迁移的预览服务提前接流量。
    Type: AWS::ECS::Service
    Condition: CreateRouting
    DependsOn:
      - PreviewListenerRule
    Properties:
      ServiceName: !Sub ${ProjectName}-pr-${PRNumber}
      Cluster:
        Fn::ImportValue: !Sub ${ProjectName}-EcsClusterArn
      TaskDefinition: !Ref PreviewTaskDefinition
      DesiredCount: !Ref DesiredCount
      PlatformVersion: LATEST
      SchedulingStrategy: REPLICA
      AvailabilityZoneRebalancing: ENABLED
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 30
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Base: 0
          Weight: 1
      DeploymentConfiguration:
        # preview 优先控制成本：DesiredCount 通常为 1，但仍保留滚动更新和
        # deployment circuit breaker，启动失败时由 ECS 自动回滚。
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub ${ProjectName}-GoTaskSecurityGroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${ProjectName}-PrivateSubnetIds
      LoadBalancers:
        - ContainerName: go-api
          ContainerPort: 8080
          TargetGroupArn: !Ref PreviewTargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: PRNumber
          Value: !Ref PRNumber
        - Key: PreviewKey
          Value: !Ref PreviewKey
        - Key: ImageTag
          Value: !Ref ImageTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAt
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  # Outputs 供 buildspec 读取并执行后续 smoke test/cleanup。EcsServiceName
  # 也带 CreateRouting 条件：未启用路由时该输出不会出现在 Stack 中。
  PreviewKey:
    Value: !Ref PreviewKey
  ImageTag:
    Value: !Ref ImageTag
  DatabaseSchema:
    Value: !Sub pr_${PRNumber}
  RuntimeTaskDefinitionArn:
    Value: !Ref PreviewTaskDefinition
  DatabaseTaskDefinitionArn:
    Value: !Ref PreviewDatabaseTaskDefinition
  TargetGroupArn:
    Value: !Ref PreviewTargetGroup
  EcsServiceName:
    # Output 与 Service 使用相同 Condition，避免资源未创建时求值 GetAtt 失败。
    Condition: CreateRouting
    Value: !GetAtt PreviewService.Name
