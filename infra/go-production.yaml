# Go API production 工作负载 Stack。共享网络、ECR、ECS Cluster、Cloud Map、
# IAM Role 都通过 ImportValue 从其他 Stack 引用；本 Stack 只拥有可频繁更新的
# TaskDefinition、双 Target Group、ListenerRule、ECS Service 和监控告警。
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Production runtime for the github-account-info Go API. Requires the shared
  go-foundation stack exports and an immutable prod-<commit-sha> ECR image.

# 本文件内置函数阅读提示：
# - !Ref Parameter 返回输入值；!Ref TaskDefinition/TargetGroup/Service 返回该资源
#   定义的主标识（可能是 ARN、名称或 ID，具体需查对应资源文档）。
# - !Sub 用参数/伪参数拼 Family、资源名和告警名。
# - Fn::ImportValue 从 foundation/IAM Stack 读取 Export，是跨 Stack 引用。
# - !Join 将 ECR URI、冒号和 ImageTag 合成完整容器镜像地址。
# - !GetAtt TargetGroup.TargetGroupFullName 读取 Ref 无法选择的特定属性。
# - !If + AWS::NoValue 在未传 SNS Topic 时移除告警通知动作。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Deployment identity
        Parameters:
          - ProjectName
          - ImageTag
          - CanaryImageTag
      - Label:
          default: Runtime
        Parameters:
          - DesiredCount
          - CanaryDesiredCount
          - StableTrafficWeight
          - CanaryTrafficWeight
          - CorsOrigins
          - CorsPreviewOriginSuffix
          - ProductionListenerPriority
      - Label:
          default: Monitoring
        Parameters:
          - AlarmTopicArn
    ParameterLabels:
      ImageTag:
        default: Stable immutable ECR tag in prod-<commit-sha> format
      CanaryImageTag:
        default: Canary immutable ECR tag in prod-<commit-sha> format
      CorsOrigins:
        default: Comma-separated exact browser origins

Parameters:
  # ImageTag 通常传不可变的 Git SHA，而不是 latest，确保每次部署可追溯、可回滚。
  # DesiredCount、CORS 和 Listener Priority 则是环境级运行参数。
  ProjectName:
    Type: String
    Default: github-account-info-go
    MinLength: 3
    MaxLength: 22
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  ImageTag:
    Type: String
    AllowedPattern: "^prod-[0-9a-f]{7,40}$"
    ConstraintDescription: Use prod- followed by a 7-40 character lowercase Git commit SHA.
  CanaryImageTag:
    Type: String
    AllowedPattern: "^prod-[0-9a-f]{7,40}$"
    ConstraintDescription: Use prod- followed by a 7-40 character lowercase Git commit SHA.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
    Description: Production task count. Set 0 only for a reviewed full runtime pause.
  CanaryDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: Run one isolated public canary task only while a release is being evaluated.
  StableTrafficWeight:
    Type: Number
    Default: 100
    MinValue: 0
    MaxValue: 100
  CanaryTrafficWeight:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
  CorsOrigins:
    Type: String
    Default: https://github-account-info.pages.dev
    MinLength: 8
    MaxLength: 1024
    Description: >-
      Comma-separated exact origins accepted by the Go API. Do not include a
      path, wildcard, query, fragment, or trailing slash.
  CorsPreviewOriginSuffix:
    Type: String
    Default: .github-account-info.pages.dev
    AllowedPattern: '^\.[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    Description: HTTPS-only Cloudflare Pages preview hostname suffix; no wildcard.
  ProductionListenerPriority:
    Type: Number
    Default: 50000
    MinValue: 50000
    MaxValue: 50000
    Description: >-
      Production path rule priority. Preview rules use their PR number in 1-49999.
  AlarmTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"
    Description: >-
      Optional existing SNS topic ARN for alarm and recovery notifications.
      Leave empty to create visible CloudWatch alarms without notifications.

Conditions:
  # SNS Topic 留空时不创建 AlarmActions/OKActions；AWS::NoValue 会移除列表项。
  HasAlarmTopic: !Not
    - !Equals
      - !Ref AlarmTopicArn
      - ""

Resources:
  # TaskDefinition 是不可变版本资源：容器镜像或配置变化会注册新 revision，
  # ECS Service 再切换到新 revision；旧 revision 保留以支持快速回滚。
  ProductionTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      # !Sub 输出例如 github-account-info-go-production，作为 TaskDefinition Family。
      Family: !Sub ${ProjectName}-production
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        # ImportValue 读取 IAM Stack 导出的角色 ARN；Fn::ImportValue 的参数
        # 不能直接写短格式 !ImportValue !Sub，因此这里使用完整函数写法。
        Fn::ImportValue: !Sub ${ProjectName}-EcsTaskExecutionRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: go-api
          Essential: true
          Image: !Join
            # !Join 将 ECR RepositoryUri、冒号和 ImageTag 拼成完整镜像地址。
            # 第一个元素是分隔符，第二个元素是待拼接列表，结果类似
            # 123.dkr.ecr.../repo:prod-<sha>。
            - ":"
            - - Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryUri
              - !Ref ImageTag
          User: "65532:65532"
          ReadonlyRootFilesystem: true
          StopTimeout: 15
          PortMappings:
            - Name: http
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
          Environment:
            - Name: APP_ENV
              Value: production
            - Name: PORT
              Value: "8080"
            - Name: DB_SCHEMA
              Value: public
            - Name: RDS_CA_BUNDLE
              Value: /etc/ssl/certs/rds-us-east-2-bundle.pem
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: CORS_PREVIEW_ORIGIN_SUFFIX
              Value: !Ref CorsPreviewOriginSuffix
          Secrets:
            # ECS 在启动容器前从 Secrets Manager 注入 DATABASE_URL；
            # Secret 值不会出现在 TaskDefinition 明文或 CloudFormation 输出中。
            - Name: DATABASE_URL
              ValueFrom:
                Fn::ImportValue: !Sub ${ProjectName}-DatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${ProjectName}-EcsLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: production
              mode: non-blocking
              max-buffer-size: 4m
          DockerLabels:
            com.github-account-info.project: !Ref ProjectName
            com.github-account-info.environment: production
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation
        - Key: ImageTag
          Value: !Ref ImageTag

  CanaryTaskDefinition:
    # Canary 使用独立 TaskDefinition，确保稳定 Service 在观察期仍运行旧镜像。
    # 它读取相同生产数据库，但不注册 Cloud Map，只能经备用 Target Group 访问。
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-production-canary
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        Fn::ImportValue: !Sub ${ProjectName}-EcsTaskExecutionRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: go-api
          Essential: true
          Image: !Join
            - ":"
            - - Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryUri
              - !Ref CanaryImageTag
          User: "65532:65532"
          ReadonlyRootFilesystem: true
          StopTimeout: 15
          PortMappings:
            - Name: http
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
          Environment:
            - Name: APP_ENV
              Value: production
            - Name: PORT
              Value: "8080"
            - Name: DB_SCHEMA
              Value: public
            - Name: RDS_CA_BUNDLE
              Value: /etc/ssl/certs/rds-us-east-2-bundle.pem
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: CORS_PREVIEW_ORIGIN_SUFFIX
              Value: !Ref CorsPreviewOriginSuffix
          Secrets:
            - Name: DATABASE_URL
              ValueFrom:
                Fn::ImportValue: !Sub ${ProjectName}-DatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${ProjectName}-EcsLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: production-canary
              mode: non-blocking
              max-buffer-size: 4m
          DockerLabels:
            com.github-account-info.project: !Ref ProjectName
            com.github-account-info.environment: production-canary
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ReleaseSlot
          Value: canary
        - Key: ManagedBy
          Value: cloudformation
        - Key: ImageTag
          Value: !Ref CanaryImageTag

  ProductionTargetGroup:
    # TargetType=ip 是 Fargate awsvpc 模式的必需配置，因为 Task 没有 EC2
    # instance ID。ALB 健康检查走轻量 /healthz；发布脚本另用 /readyz 验证数据库，
    # 避免短暂数据库抖动导致 ALB 频繁摘除仍可正常运行的进程。
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-prod
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-VpcId
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: 8080
      TargetType: ip
      IpAddressType: ipv4
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: stickiness.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation

  ProductionAlternateTargetGroup:
    # 独立 Canary Service 将候选版本注册到备用 Target Group；平时没有 Target。
    # 它与稳定组使用相同 /healthz，发布脚本等待 healthy 后才进行业务 readiness 检查。
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-prod-alt
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-VpcId
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: 8080
      TargetType: ip
      IpAddressType: ipv4
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: stickiness.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation

  ProductionListenerRule:
    # production 使用固定优先级和 /api/v1/*、/healthz、/readyz 路径匹配；
    # Listener 默认动作仍是 404，只有命中规则的请求才进入 Target Group。
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub ${ProjectName}-InternalHttpListenerArn
      Priority: !Ref ProductionListenerPriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/v1/*
              - /healthz
              - /readyz
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref ProductionTargetGroup
                Weight: !Ref StableTrafficWeight
              - TargetGroupArn: !Ref ProductionAlternateTargetGroup
                Weight: !Ref CanaryTrafficWeight

  ProductionService:
    # 稳定 Service 保留 Cloud Map，只做支持零停机与自动回滚的 Rolling 更新。
    # 公网灰度由下方独立 Canary Service 和 ListenerRule 权重完成。
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${ProjectName}-production
      Cluster:
        Fn::ImportValue: !Sub ${ProjectName}-EcsClusterArn
      # 对 ECS::TaskDefinition 使用 !Ref 返回完整 ARN，并包含具体 revision。
      TaskDefinition: !Ref ProductionTaskDefinition
      DesiredCount: !Ref DesiredCount
      PlatformVersion: LATEST
      SchedulingStrategy: REPLICA
      AvailabilityZoneRebalancing: ENABLED
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 30
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: 1
          Weight: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub ${ProjectName}-GoTaskSecurityGroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${ProjectName}-PrivateSubnetIds
      LoadBalancers:
        - ContainerName: go-api
          ContainerPort: 8080
          TargetGroupArn: !Ref ProductionTargetGroup
      ServiceRegistries:
        # 注册到 Cloud Map 后，Node Lambda 可通过私有 DNS 直接访问 Go Task。
        - RegistryArn:
            Fn::ImportValue: !Sub ${ProjectName}-CloudMapServiceArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation
        - Key: ImageTag
          Value: !Ref ImageTag

  ProductionCanaryService:
    # Canary Service 不注册 Cloud Map，因此不会进入 Node -> Go 私有 DNS 链路。
    # 平时 DesiredCount=0；发布观察期运行一个 Task 并通过 ALB 权重接收流量。
    Type: AWS::ECS::Service
    DependsOn: ProductionListenerRule
    Properties:
      ServiceName: !Sub ${ProjectName}-production-canary
      Cluster:
        Fn::ImportValue: !Sub ${ProjectName}-EcsClusterArn
      TaskDefinition: !Ref CanaryTaskDefinition
      DesiredCount: !Ref CanaryDesiredCount
      PlatformVersion: LATEST
      SchedulingStrategy: REPLICA
      AvailabilityZoneRebalancing: ENABLED
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 30
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: 0
          Weight: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub ${ProjectName}-GoTaskSecurityGroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${ProjectName}-PrivateSubnetIds
      LoadBalancers:
        - ContainerName: go-api
          ContainerPort: 8080
          TargetGroupArn: !Ref ProductionAlternateTargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ReleaseSlot
          Value: canary
        - Key: ManagedBy
          Value: cloudformation
        - Key: ImageTag
          Value: !Ref CanaryImageTag

  ProductionUnhealthyTargetsAlarm:
    # Target Group 出现不健康目标时报警，用于发现 readiness、网络或进程故障。
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-production-unhealthy-targets
      AlarmDescription: Production ALB has one or more unhealthy Go targets.
      Metrics:
        - Id: unhealthy
          Label: Unhealthy targets across both canary target groups
          Expression: MAX([primary,alternate])
          ReturnData: true
        - Id: primary
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: UnHealthyHostCount
              Dimensions:
                - Name: LoadBalancer
                  Value:
                    Fn::ImportValue: !Sub ${ProjectName}-InternalLoadBalancerFullName
                - Name: TargetGroup
                  Value: !GetAtt ProductionTargetGroup.TargetGroupFullName
            Period: 60
            Stat: Maximum
        - Id: alternate
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: UnHealthyHostCount
              Dimensions:
                - Name: LoadBalancer
                  Value:
                    Fn::ImportValue: !Sub ${ProjectName}-InternalLoadBalancerFullName
                - Name: TargetGroup
                  Value: !GetAtt ProductionAlternateTargetGroup.TargetGroupFullName
            Period: 60
            Stat: Maximum
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

  ProductionTarget5xxAlarm:
    # 监控 Go Target 返回的 5xx；与 API Gateway 5xx 分开，便于判断错误层级。
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-production-target-5xx
      AlarmDescription: Production Go targets returned repeated HTTP 5xx responses.
      Metrics:
        - Id: target5xx
          Label: Target 5xx across both canary target groups
          Expression: SUM([primary,alternate])
          ReturnData: true
        - Id: primary
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value:
                    Fn::ImportValue: !Sub ${ProjectName}-InternalLoadBalancerFullName
                - Name: TargetGroup
                  Value: !GetAtt ProductionTargetGroup.TargetGroupFullName
            Period: 60
            Stat: Sum
        - Id: alternate
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value:
                    Fn::ImportValue: !Sub ${ProjectName}-InternalLoadBalancerFullName
                - Name: TargetGroup
                  Value: !GetAtt ProductionAlternateTargetGroup.TargetGroupFullName
            Period: 60
            Stat: Sum
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

  ProductionRunningTaskCountAlarm:
    # RunningTaskCount 低于 1 表示 production 已无可服务 Task，是高优先级故障。
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-production-no-running-task
      AlarmDescription: Production ECS service has no running Go task.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value:
            Fn::ImportValue: !Sub ${ProjectName}-EcsClusterName
        - Name: ServiceName
          Value: !GetAtt ProductionService.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

  ProductionHighCpuAlarm:
    # CPU 持续过高可能表示流量激增、死循环或容量不足；连续周期触发以减少噪声。
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-production-high-cpu
      AlarmDescription: Production ECS service CPU utilization stayed above 85 percent.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value:
            Fn::ImportValue: !Sub ${ProjectName}-EcsClusterName
        - Name: ServiceName
          Value: !GetAtt ProductionService.Name
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

Outputs:
  # 输出当前镜像、TaskDefinition、TargetGroup 与 Service 标识，供部署脚本验收
  # 和人工回滚使用；这些输出没有 Export，不构成新的跨 Stack 耦合。
  ImageTag:
    Description: Immutable ECR tag deployed by this stack revision.
    Value: !Ref ImageTag
  TaskDefinitionArn:
    Value: !Ref ProductionTaskDefinition
  CanaryTaskDefinitionArn:
    Value: !Ref CanaryTaskDefinition
  TargetGroupArn:
    Value: !Ref ProductionTargetGroup
  AlternateTargetGroupArn:
    Value: !Ref ProductionAlternateTargetGroup
  EcsServiceArn:
    Value: !Ref ProductionService
  EcsServiceName:
    Value: !GetAtt ProductionService.Name
  CanaryEcsServiceArn:
    Value: !Ref ProductionCanaryService
  CanaryEcsServiceName:
    Value: !GetAtt ProductionCanaryService.Name
