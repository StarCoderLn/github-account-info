AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Portable VPC, network egress, PostgreSQL RDS, security groups, and optional
  SSM bastion for github-account-info account migration.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project and network
        Parameters:
          - ProjectName
          - VpcCidr
          - PublicSubnetCidr
          - PrivateSubnetACidr
          - PrivateSubnetBCidr
          - CreateNatGateway
      - Label:
          default: Database
        Parameters:
          - CreateDatabase
          - DBSnapshotIdentifier
          - DatabaseName
          - DatabaseMasterUsername
          - DatabaseInstanceClass
          - DatabaseAllocatedStorage
          - DatabaseBackupRetentionDays
          - DatabaseDeletionProtection
      - Label:
          default: Operations access
        Parameters:
          - CreateSsmBastion
          - BastionInstanceType

Parameters:
  ProjectName:
    Type: String
    Default: github-account-info
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "^(10|172|192)\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/(16|17|18|19|20|21|22|23|24)$"
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.3.0/24
  CreateNatGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Required for the current online architecture. Set false only for a
      dormant restore preparation environment that will not run Lambda, ECS,
      SSM, or external GitHub API calls.
  CreateDatabase:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      For snapshot migration, first create this stack with false, copy the
      shared snapshot using the output KMS key, then update with true.
  DBSnapshotIdentifier:
    Type: String
    Default: ""
    Description: Target-account snapshot identifier or ARN; empty creates a new DB.
  DatabaseName:
    Type: String
    Default: github_account_info
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
  DatabaseMasterUsername:
    Type: String
    Default: github_account_info_admin
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedPattern: "^db\\.[a-z0-9]+\\.[a-z0-9]+$"
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  DatabaseDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  CreateSsmBastion:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Optional zero-ingress SSM instance for database port forwarding.
  BastionInstanceType:
    Type: String
    Default: t3.micro
    AllowedPattern: "^[a-z0-9]+\\.[a-z0-9]+$"

Rules:
  BastionRequiresNat:
    RuleCondition: !Equals [!Ref CreateSsmBastion, "true"]
    Assertions:
      - Assert: !Equals [!Ref CreateNatGateway, "true"]
        AssertDescription: The private SSM bastion requires NAT egress.

Conditions:
  HasNatGateway: !Equals [!Ref CreateNatGateway, "true"]
  HasDatabase: !Equals [!Ref CreateDatabase, "true"]
  HasSnapshot: !Not [!Equals [!Ref DBSnapshotIdentifier, ""]]
  IsNewDatabase: !And
    - !Equals [!Ref CreateDatabase, "true"]
    - !Equals [!Ref DBSnapshotIdentifier, ""]
  HasSsmBastion: !Equals [!Ref CreateSsmBastion, "true"]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, "true"]

Resources:
  ProjectVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw
        - Key: Project
          Value: !Ref ProjectName

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ProjectVpc
      InternetGatewayId: !Ref InternetGateway

  PublicEgressSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-egress-a
        - Key: Project
          Value: !Ref ProjectName

  PrivateApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnetACidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: Project
          Value: !Ref ProjectName

  PrivateApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnetBCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: Project
          Value: !Ref ProjectName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProjectVpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public
        - Key: Project
          Value: !Ref ProjectName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicEgressSubnet
      RouteTableId: !Ref PublicRouteTable

  NatGatewayEip:
    Type: AWS::EC2::EIP
    Condition: HasNatGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat
        - Key: Project
          Value: !Ref ProjectName

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: HasNatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicEgressSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat
        - Key: Project
          Value: !Ref ProjectName

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProjectVpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private
        - Key: Project
          Value: !Ref ProjectName

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: HasNatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateApplicationSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateApplicationSubnetB
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Node Lambda egress and RDS access
      VpcId: !Ref ProjectVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-lambda-sg
        - Key: Project
          Value: !Ref ProjectName

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from project workloads only
      VpcId: !Ref ProjectVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-rds-sg
        - Key: Project
          Value: !Ref ProjectName

  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: PostgreSQL from Node Lambda

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasSsmBastion
    Properties:
      GroupDescription: Zero-ingress SSM database tunnel host
      VpcId: !Ref ProjectVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-bastion-sg
        - Key: Project
          Value: !Ref ProjectName

  RdsIngressFromBastion:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsmBastion
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BastionSecurityGroup
      Description: PostgreSQL from zero-ingress SSM bastion

  DatabaseKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub ${ProjectName} RDS snapshots and storage
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DatabaseKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${ProjectName}/rds
      TargetKeyId: !Ref DatabaseKmsKey

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${ProjectName} private database subnets
      SubnetIds:
        - !Ref PrivateApplicationSubnetA
        - !Ref PrivateApplicationSubnetB
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DatabaseMasterSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsNewDatabase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}/database/master
      Description: Generated RDS administrator credential; not used directly by applications.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DatabaseMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Condition: HasDatabase
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-db
      Engine: postgres
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !If
        - HasSnapshot
        - !Ref AWS::NoValue
        - !Ref DatabaseAllocatedStorage
      MaxAllocatedStorage: !If
        - HasSnapshot
        - !Ref AWS::NoValue
        - 100
      StorageType: !If
        - HasSnapshot
        - !Ref AWS::NoValue
        - gp3
      StorageEncrypted: !If [HasSnapshot, !Ref AWS::NoValue, true]
      KmsKeyId: !If [HasSnapshot, !Ref AWS::NoValue, !Ref DatabaseKmsKey]
      DBSnapshotIdentifier: !If
        - HasSnapshot
        - !Ref DBSnapshotIdentifier
        - !Ref AWS::NoValue
      DBName: !If
        - HasSnapshot
        - !Ref AWS::NoValue
        - !Ref DatabaseName
      MasterUsername: !If
        - HasSnapshot
        - !Ref AWS::NoValue
        - !Ref DatabaseMasterUsername
      MasterUserPassword: !If
        - HasSnapshot
        - !Ref AWS::NoValue
        - !Sub "{{resolve:secretsmanager:${DatabaseMasterSecret}:SecretString:password}}"
      Port: 5432
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: !If [ProtectDatabase, true, false]
      EnablePerformanceInsights: false
      MonitoringInterval: 0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-db
        - Key: Project
          Value: !Ref ProjectName

  BastionRole:
    Type: AWS::IAM::Role
    Condition: HasSsmBastion
    Properties:
      RoleName: !Sub ${ProjectName}-bastion-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: HasSsmBastion
    Properties:
      InstanceProfileName: !Sub ${ProjectName}-bastion-role
      Roles:
        - !Ref BastionRole

  BastionInstance:
    Type: AWS::EC2::Instance
    Condition: HasSsmBastion
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref BastionInstanceType
      IamInstanceProfile: !Ref BastionInstanceProfile
      SubnetId: !Ref PrivateApplicationSubnetA
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      SourceDestCheck: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-bastion
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  VpcId:
    Value: !Ref ProjectVpc
  PublicSubnetId:
    Value: !Ref PublicEgressSubnet
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateApplicationSubnetA, !Ref PrivateApplicationSubnetB]]
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
  DatabaseKmsKeyArn:
    Description: Use this target-account key when copying a shared RDS snapshot.
    Value: !GetAtt DatabaseKmsKey.Arn
  DatabaseMasterSecretArn:
    Condition: IsNewDatabase
    Description: Generated administrator credential; create separate application URL Secrets.
    Value: !Ref DatabaseMasterSecret
  DatabaseIdentifier:
    Condition: HasDatabase
    Value: !Ref DatabaseInstance
  DatabaseEndpointAddress:
    Condition: HasDatabase
    Value: !GetAtt DatabaseInstance.Endpoint.Address
  DatabaseEndpointPort:
    Condition: HasDatabase
    Value: !GetAtt DatabaseInstance.Endpoint.Port
  DatabaseName:
    Condition: HasDatabase
    Value: !If [HasSnapshot, restored-from-snapshot, !Ref DatabaseName]
  BastionInstanceId:
    Condition: HasSsmBastion
    Value: !Ref BastionInstance
