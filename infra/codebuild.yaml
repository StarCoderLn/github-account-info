# CI/CD 基础设施 Stack：创建 production、PR preview、TTL cleanup 三个
# CodeBuild Project，并用 CodeConnections 接收 GitHub 事件。CloudFormation
# 负责“流水线资源”，BuildSpec 负责“流水线运行时步骤”，两层不要混淆。
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Trusted master-branch CodeBuild project for testing, building, pushing, and
  deploying the github-account-info Go API. PR builds use a separate project
  defined later and must not reuse this production webhook.

# 本文件内置函数阅读提示：
# - !Ref Parameter 返回参数值；!Ref LogGroup/CodeBuild Project 返回资源名称。
# - !Sub 用 ProjectName 和 AWS 伪参数拼名称、ARN、环境变量值。
# - Fn::ImportValue 从 IAM/foundation Stack 读取角色、ECR、Cluster 等 Export。
# - !GetAtt CodeBuildProject.Arn / EventRule.Arn 获取 ARN；Ref 只返回名称。
# - CloudFormation 函数只解析外层模板；BuildSpec: | 内的 ${SHELL_VAR} 是 Bash
#   环境变量，不是 !Sub，占位符会留到 CodeBuild 运行时展开。

Metadata:
  # AWS::CloudFormation::Interface 只影响 Console 创建 Stack 时的参数分组，
  # 不会创建资源，也不会改变参数校验或部署逻辑。
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project identity
        Parameters:
          - ProjectName
          - GitHubRepositoryUrl
          - GitHubConnectionArn
      - Label:
          default: Production endpoint
        Parameters:
          - PublicApiBaseUrl
          - CorsOrigins
      - Label:
          default: Build capacity
        Parameters:
          - CodeBuildImage
          - ComputeType
          - ScheduledPreviewCleanupExpression

Parameters:
  # 仓库、Connection ARN、API 地址和构建规格都从参数传入；敏感数据库连接串
  # 不进入 CodeBuild 环境变量，而由 ECS Execution Role 在运行时读取 Secret。
  ProjectName:
    Type: String
    Default: github-account-info-go
    MinLength: 3
    MaxLength: 22
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  GitHubRepositoryUrl:
    Type: String
    Default: https://github.com/StarCoderLn/github-account-info.git
    AllowedPattern: "^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\.git$"
  GitHubConnectionArn:
    Type: String
    Description: Existing AVAILABLE AWS CodeConnections connection authorized for this repository.
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):codeconnections:[a-z0-9-]+:[0-9]{12}:connection/[A-Za-z0-9-]+$"
  PublicApiBaseUrl:
    Type: String
    Description: Existing API Gateway base URL used for post-deployment smoke tests.
    AllowedPattern: "^https://[a-z0-9-]+\\.execute-api\\.[a-z0-9-]+\\.amazonaws\\.com(\\.cn)?$"
  CorsOrigins:
    Type: String
    Default: https://github-account-info.pages.dev
    MinLength: 8
    MaxLength: 1024
  CodeBuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    AllowedValues:
      - aws/codebuild/standard:7.0
  ComputeType:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
  ScheduledPreviewCleanupExpression:
    Type: String
    Default: cron(0 3 * * ? *)
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^(rate|cron)\\([0-9A-Za-z*?,/ -]+\\)$"
    Description: >-
      EventBridge schedule for the tag-driven preview TTL fallback. The default
      runs daily at 03:00 UTC; normal PR close cleanup remains event-driven.

Resources:
  # 将“使用这一条 GitHub Connection”的权限附加到两个由 IAM Stack 创建的
  # CodeBuild Role。独立 AWS::IAM::Policy 可避免 IAM/CodeBuild Stack 循环依赖。
  CodeBuildConnectionUsePolicy:
    Type: AWS::IAM::Policy
    Properties:
      # !Sub 生成策略名；下面 ImportValue 内的 !Sub 则先生成“Export 名”，
      # 再由 Fn::ImportValue 用该名称读取另一个 Stack 的输出值。
      PolicyName: !Sub ${ProjectName}-use-github-connection
      Roles:
        - Fn::ImportValue: !Sub ${ProjectName}-CodeBuildRoleName
        - Fn::ImportValue: !Sub ${ProjectName}-PreviewCodeBuildRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UseOnlyConfiguredGitHubConnection
            Effect: Allow
            Action:
              - codeconnections:GetConnection
              - codeconnections:GetConnectionToken
              - codeconnections:UseConnection
            Resource: !Ref GitHubConnectionArn

  ProductionBuildLogGroup:
    # production 构建日志保留 30 天，Stack 删除/替换时仍保留以便审计。
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ProjectName}-production
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation

  ProductionBuildProject:
    # 只接受 master push，并用 FILE_PATH 过滤无关改动。BuildSpec 放在可信的
    # master 仓库文件中；ConcurrentBuildLimit=1 避免并发部署同一 production Stack。
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildConnectionUsePolicy
    Properties:
      Name: !Sub ${ProjectName}-production
      Description: Trusted master build and deployment for the Go API
      ServiceRole:
        Fn::ImportValue: !Sub ${ProjectName}-CodeBuildRoleArn
      Source:
        # CodeConnections 负责 GitHub 授权；ReportBuildStatus 会把结果回写为
        # GitHub check。GitCloneDepth=1 可减少 production 构建下载量。
        Type: GITHUB
        Location: !Ref GitHubRepositoryUrl
        SourceIdentifier: PRIMARY_SOURCE
        GitCloneDepth: 1
        BuildSpec: infra/buildspec/go-production.yml
        ReportBuildStatus: true
        BuildStatusConfig:
          Context: codebuild/go-production
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref GitHubConnectionArn
      SourceVersion: refs/heads/master
      Triggers:
        Webhook: true
        BuildType: BUILD
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: ^refs/heads/master$
            - Type: FILE_PATH
              Pattern: >-
                ^(apps/go-api/|infra/(go-foundation\.yaml|go-production\.yaml|codebuild\.yaml|buildspec/go-production\.yml|scripts/deploy-go-production\.sh)|packages/db/src/(migrations|schema)/).*
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        # Docker layer/source cache 是 CodeBuild 宿主机本地缓存，不保证每次命中。
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_SOURCE_CACHE
      Environment:
        # 构建 Docker 镜像需要 privileged 模式；这也是 production Project
        # 只能由可信 master 触发、不能直接运行外部 PR 代码的原因。
        Type: LINUX_CONTAINER
        Image: !Ref CodeBuildImage
        ComputeType: !Ref ComputeType
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Type: PLAINTEXT
            Value: !Ref ProjectName
          - Name: AWS_ACCOUNT_ID
            Type: PLAINTEXT
            Value: !Ref AWS::AccountId
          - Name: AWS_URL_SUFFIX
            Type: PLAINTEXT
            Value: !Ref AWS::URLSuffix
          - Name: ECR_REPOSITORY_NAME
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryName
          - Name: ECR_REPOSITORY_URI
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryUri
          - Name: ECS_CLUSTER_NAME
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcsClusterName
          - Name: ECS_SERVICE_NAME
            Type: PLAINTEXT
            Value: !Sub ${ProjectName}-production
          - Name: PRODUCTION_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub ${ProjectName}-production
          - Name: PUBLIC_API_BASE_URL
            Type: PLAINTEXT
            Value: !Ref PublicApiBaseUrl
          - Name: CORS_ORIGINS
            Type: PLAINTEXT
            Value: !Ref CorsOrigins
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ProductionBuildLogGroup
          StreamName: build
        S3Logs:
          Status: DISABLED
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 30
      ConcurrentBuildLimit: 1
      BadgeEnabled: false
      Visibility: PRIVATE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: cloudformation

  PreviewBuildLogGroup:
    # preview 日志保留时间更短，因为 PR 构建数量多、生命周期短。
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ProjectName}-preview
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: cloudformation

  PreviewBuildProject:
    # PR 预览同时处理 deploy 与 cleanup。GitCloneDepth=0 保留完整提交信息；
    # PullRequestBuildPolicy 要求有写权限的协作者批准后才运行 PR 代码。
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildConnectionUsePolicy
    Properties:
      Name: !Sub ${ProjectName}-preview
      Description: Approved pull-request build, deployment, and cleanup for isolated Go previews
      ServiceRole:
        Fn::ImportValue: !Sub ${ProjectName}-PreviewCodeBuildRoleArn
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepositoryUrl
        SourceIdentifier: PRIMARY_SOURCE
        GitCloneDepth: 0
        ReportBuildStatus: true
        BuildStatusConfig:
          Context: codebuild/go-preview
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref GitHubConnectionArn
        # 安全边界：具有 AWS 部署权限的 BuildSpec 内嵌在 CloudFormation 中，
        # PR 只能改变应用源码，不能通过修改仓库 buildspec 扩大云端权限。
        BuildSpec: |
          # 以下内容是“嵌入字符串中的另一份 YAML”，由 CodeBuild 在运行时解析。
          # version 0.2 让每个 phase 的 commands 在同一 shell 上下文中执行。
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              # install 只验证构建镜像中必要工具存在，不安装未经锁定的新依赖。
              commands:
                - set -euo pipefail
                - aws --version
                - docker version
                - node --version
            pre_build:
              # pre_build 建立信任边界：校验 PR 编号和 webhook 事件，计算不可变
              # 镜像 tag/preview key，并在 deploy 路径登录 ECR、拉取固定 digest builder。
              commands:
                - set -euo pipefail
                - '[[ "${CODEBUILD_SOURCE_VERSION:-}" =~ ^pr/([1-9][0-9]{0,4})$ ]] || { echo "source version must be pr/<1-49999>" >&2; exit 1; }'
                - PR_NUMBER="${CODEBUILD_SOURCE_VERSION#pr/}"
                - '[[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "invalid PR number" >&2; exit 1; }'
                - '(( PR_NUMBER <= 49999 )) || { echo "PR number exceeds listener priority range" >&2; exit 1; }'
                - STACK_NAME="${PROJECT_NAME}-pr-${PR_NUMBER}"
                - SCHEMA_NAME="pr_${PR_NUMBER}"
                - rm -f "$CODEBUILD_SRC_DIR/.codebuild-preview-image-ready"
                - |
                  case "${CODEBUILD_WEBHOOK_EVENT:-}" in
                    PULL_REQUEST_CREATED|PULL_REQUEST_UPDATED|PULL_REQUEST_REOPENED)
                      PREVIEW_ACTION=deploy
                      ;;
                    PULL_REQUEST_MERGED|PULL_REQUEST_CLOSED)
                      PREVIEW_ACTION=cleanup
                      ;;
                    *)
                      echo "unsupported preview webhook event: ${CODEBUILD_WEBHOOK_EVENT:-missing}" >&2
                      exit 1
                      ;;
                  esac
                - |
                  if [[ "$PREVIEW_ACTION" == "deploy" ]]; then
                    COMMIT_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-}"
                    COMMIT_SHA="$(printf '%s' "$COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
                    [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "head commit must be a full SHA" >&2; exit 1; }
                    PREVIEW_KEY="$(node packages/preview-environment/cli.mjs "$COMMIT_SHA")"
                    [[ "$PREVIEW_KEY" =~ ^preview-[0-9a-f]{12}$ ]] || { echo "invalid preview key" >&2; exit 1; }
                    IMAGE_TAG="pr-${PR_NUMBER}-${COMMIT_SHA}"
                    IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
                    EXPIRES_AT="$(date -u -d '+7 days' '+%Y-%m-%dT%H:%M:%SZ')"
                    GO_BUILDER_IMAGE="$(awk '$1 == "ARG" && $2 ~ /^GO_IMAGE=/ { sub(/^GO_IMAGE=/, "", $2); print $2; exit }' apps/go-api/Dockerfile)"
                    [[ "$GO_BUILDER_IMAGE" == *@sha256:* ]] || { echo "Go builder image must be digest-pinned" >&2; exit 1; }
                    aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.${AWS_URL_SUFFIX:-amazonaws.com}"
                    docker pull "$GO_BUILDER_IMAGE"
                  fi
                - export PR_NUMBER STACK_NAME SCHEMA_NAME PREVIEW_ACTION COMMIT_SHA PREVIEW_KEY IMAGE_TAG IMAGE_URI EXPIRES_AT GO_BUILDER_IMAGE
            build:
              # build 先做 gofmt/mod verify/vet/test，再构建非 root 镜像、推送 ECR，
              # 最后读取 digest 验证镜像确实已经落到仓库。
              commands:
                - set -euo pipefail
                - |
                  if [[ "$PREVIEW_ACTION" == "deploy" ]]; then
                    UNFORMATTED="$(docker run --rm -v "$CODEBUILD_SRC_DIR/apps/go-api:/src:ro" -w /src "$GO_BUILDER_IMAGE" sh -c 'gofmt -l .')"
                    [[ -z "$UNFORMATTED" ]] || { printf 'Unformatted Go files:\n%s\n' "$UNFORMATTED" >&2; exit 1; }
                    docker run --rm -v "$CODEBUILD_SRC_DIR/apps/go-api:/src:ro" -v go-mod-cache:/go/pkg/mod -v go-build-cache:/root/.cache/go-build -w /src "$GO_BUILDER_IMAGE" go mod verify
                    docker run --rm -v "$CODEBUILD_SRC_DIR/apps/go-api:/src:ro" -v go-mod-cache:/go/pkg/mod -v go-build-cache:/root/.cache/go-build -w /src "$GO_BUILDER_IMAGE" go vet ./...
                    docker run --rm -v "$CODEBUILD_SRC_DIR/apps/go-api:/src:ro" -v go-mod-cache:/go/pkg/mod -v go-build-cache:/root/.cache/go-build -w /src "$GO_BUILDER_IMAGE" go test ./...
                    DOCKER_BUILDKIT=1 docker build --platform linux/amd64 --pull --tag "$IMAGE_URI" apps/go-api
                    [[ "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_URI")" == "65532:65532" ]] || { echo "preview image is not non-root" >&2; exit 1; }
                    docker push "$IMAGE_URI"
                    IMAGE_DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
                    [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ECR image digest verification failed" >&2; exit 1; }
                    touch "$CODEBUILD_SRC_DIR/.codebuild-preview-image-ready"
                  fi
            post_build:
              # post_build 编排云资源。先以 RoutingEnabled=false 创建数据库 Task，
              # migration 成功后再启用 Service/Listener Rule，避免未就绪服务接流量。
              commands:
                - set -euo pipefail
                - |
                  run_database_task() {
                    # 使用一次性 Fargate Task 创建/删除 PR schema，并严格检查退出码。
                    local operation="$1"
                    local task_definition="$2"
                    local command_json
                    if [[ "$operation" == "create" ]]; then
                      command_json="[\"create\",\"--pr-number\",\"${PR_NUMBER}\"]"
                    else
                      command_json="[\"drop\",\"--pr-number\",\"${PR_NUMBER}\",\"--confirm-schema\",\"${SCHEMA_NAME}\"]"
                    fi
                    local overrides="{\"containerOverrides\":[{\"name\":\"preview-db\",\"command\":${command_json}}]}"
                    local task_arn
                    task_arn="$(aws ecs run-task \
                      --region "$AWS_DEFAULT_REGION" \
                      --cluster "$ECS_CLUSTER_NAME" \
                      --task-definition "$task_definition" \
                      --launch-type FARGATE \
                      --network-configuration "awsvpcConfiguration={subnets=[${PRIVATE_SUBNET_IDS}],securityGroups=[${GO_TASK_SECURITY_GROUP_ID}],assignPublicIp=DISABLED}" \
                      --overrides "$overrides" \
                      --query 'tasks[0].taskArn' \
                      --output text)"
                    [[ "$task_arn" == arn:*:ecs:*:task/* ]] || { echo "preview database task did not start" >&2; exit 1; }
                    aws ecs wait tasks-stopped --region "$AWS_DEFAULT_REGION" --cluster "$ECS_CLUSTER_NAME" --tasks "$task_arn"
                    local exit_code
                    exit_code="$(aws ecs describe-tasks --region "$AWS_DEFAULT_REGION" --cluster "$ECS_CLUSTER_NAME" --tasks "$task_arn" --query 'tasks[0].containers[?name==`preview-db`].exitCode | [0]' --output text)"
                    [[ "$exit_code" == "0" ]] || { echo "preview database ${operation} task failed with exit code ${exit_code}" >&2; exit 1; }
                  }

                  deploy_stack() {
                    # 同一函数分两阶段部署：false/0 准备数据库，true/1 开放路由。
                    local routing_enabled="$1"
                    local desired_count="$2"
                    aws cloudformation deploy \
                      --region "$AWS_DEFAULT_REGION" \
                      --stack-name "$STACK_NAME" \
                      --template-file infra/go-preview.yaml \
                      --no-fail-on-empty-changeset \
                      --parameter-overrides \
                        ProjectName="$PROJECT_NAME" \
                        PRNumber="$PR_NUMBER" \
                        PreviewKey="$PREVIEW_KEY" \
                        ImageTag="$IMAGE_TAG" \
                        ExpiresAt="$EXPIRES_AT" \
                        DesiredCount="$desired_count" \
                        RoutingEnabled="$routing_enabled" \
                        CorsOrigins="$CORS_ORIGINS" \
                        CorsPreviewOriginSuffix="$CORS_PREVIEW_ORIGIN_SUFFIX" \
                      --tags \
                        Project="$PROJECT_NAME" \
                        Environment=preview \
                        PRNumber="$PR_NUMBER" \
                        PreviewKey="$PREVIEW_KEY" \
                        ExpiresAt="$EXPIRES_AT" \
                        ManagedBy=cloudformation
                  }

                  stack_exists() {
                    # 只把明确的“Stack 不存在”当作正常 false；权限/网络错误必须失败。
                    local output status
                    set +e
                    output="$(aws cloudformation describe-stacks --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME" --output text 2>&1)"
                    status=$?
                    set -e
                    if [[ "$status" -eq 0 ]]; then return 0; fi
                    if [[ "$output" == *"does not exist"* ]]; then return 1; fi
                    echo "unable to determine preview stack state" >&2
                    exit 1
                  }

                  if [[ "$PREVIEW_ACTION" == "deploy" ]]; then
                    # 部署顺序：模板(无路由) → schema/migration → 模板(有路由)
                    # → 等待 ECS 稳定 → 通过公网入口做健康和业务 smoke test。
                    [[ "${CODEBUILD_BUILD_SUCCEEDING:-0}" == "1" ]] || { echo "build failed; preview deployment blocked" >&2; exit 1; }
                    [[ -f "$CODEBUILD_SRC_DIR/.codebuild-preview-image-ready" ]] || { echo "verified preview image marker missing" >&2; exit 1; }
                    deploy_stack false 0
                    DATABASE_TASK_DEFINITION="$(aws cloudformation describe-stacks --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DatabaseTaskDefinitionArn`].OutputValue | [0]' --output text)"
                    run_database_task create "$DATABASE_TASK_DEFINITION"
                    deploy_stack true 1
                    aws ecs wait services-stable --region "$AWS_DEFAULT_REGION" --cluster "$ECS_CLUSTER_NAME" --services "${PROJECT_NAME}-pr-${PR_NUMBER}"
                    curl --fail --silent --show-error --max-time 15 -H "X-Preview-Environment: ${PREVIEW_KEY}" "${PUBLIC_API_BASE_URL}/healthz" >/dev/null
                    curl --fail --silent --show-error --max-time 15 -H "X-Preview-Environment: ${PREVIEW_KEY}" "${PUBLIC_API_BASE_URL}/api/v1/github-users/preview-user/introduction" >/dev/null
                    echo "PR ${PR_NUMBER} preview ${PREVIEW_KEY} is ready"
                  else
                    # 清理顺序：先关闭路由/Service → 删除 schema → 删除 Stack。
                    # 这样能避免仍有请求或数据库连接时提前删除数据。
                    if ! stack_exists; then
                      echo "PR ${PR_NUMBER} preview stack is already absent"
                      exit 0
                    fi
                    PREVIEW_KEY="$(aws cloudformation describe-stacks --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME" --query 'Stacks[0].Parameters[?ParameterKey==`PreviewKey`].ParameterValue | [0]' --output text)"
                    IMAGE_TAG="$(aws cloudformation describe-stacks --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME" --query 'Stacks[0].Parameters[?ParameterKey==`ImageTag`].ParameterValue | [0]' --output text)"
                    EXPIRES_AT="$(aws cloudformation describe-stacks --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME" --query 'Stacks[0].Parameters[?ParameterKey==`ExpiresAt`].ParameterValue | [0]' --output text)"
                    deploy_stack false 0
                    DATABASE_TASK_DEFINITION="$(aws cloudformation describe-stacks --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DatabaseTaskDefinitionArn`].OutputValue | [0]' --output text)"
                    run_database_task drop "$DATABASE_TASK_DEFINITION"
                    aws cloudformation delete-stack --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME"
                    aws cloudformation wait stack-delete-complete --region "$AWS_DEFAULT_REGION" --stack-name "$STACK_NAME"
                    echo "PR ${PR_NUMBER} preview resources and ${SCHEMA_NAME} were removed"
                  fi
              finally:
                # finally 无论前面成功失败都会执行，清除仅用于本次构建的标记文件。
                - rm -f "$CODEBUILD_SRC_DIR/.codebuild-preview-image-ready"
      Triggers:
        # deploy 与 cleanup 使用两组 webhook filter；cleanup 不设 FILE_PATH，确保
        # 即使 PR 没改 Go 文件，关闭事件也能回收之前可能存在的 preview。
        Webhook: true
        BuildType: BUILD
        FilterGroups:
          - - Type: EVENT
              Pattern: PULL_REQUEST_CREATED,PULL_REQUEST_UPDATED,PULL_REQUEST_REOPENED
            - Type: BASE_REF
              Pattern: ^refs/heads/master$
            - Type: FILE_PATH
              Pattern: >-
                ^(apps/go-api/|apps/web/|packages/(api|env|preview-environment)/|infra/(go-preview\.yaml|go-foundation\.yaml|go-production\.yaml|codebuild\.yaml)|packages/db/src/(migrations|schema)/).*
          - - Type: EVENT
              Pattern: PULL_REQUEST_MERGED,PULL_REQUEST_CLOSED
            - Type: BASE_REF
              Pattern: ^refs/heads/master$
        PullRequestBuildPolicy:
          RequiresCommentApproval: ALL_PULL_REQUESTS
          ApproverRoles:
            - GITHUB_ADMIN
            - GITHUB_MAINTAIN
            - GITHUB_WRITE
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_SOURCE_CACHE
      Environment:
        # preview 也构建 Docker，故需要 privileged；通过人工批准和内嵌 BuildSpec
        # 约束不可信 PR。并发上限 5 允许多个 PR 同时拥有隔离环境。
        Type: LINUX_CONTAINER
        Image: !Ref CodeBuildImage
        ComputeType: !Ref ComputeType
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Type: PLAINTEXT
            Value: !Ref ProjectName
          - Name: AWS_ACCOUNT_ID
            Type: PLAINTEXT
            Value: !Ref AWS::AccountId
          - Name: AWS_URL_SUFFIX
            Type: PLAINTEXT
            Value: !Ref AWS::URLSuffix
          - Name: ECR_REPOSITORY_NAME
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryName
          - Name: ECR_REPOSITORY_URI
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcrRepositoryUri
          - Name: ECS_CLUSTER_NAME
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcsClusterName
          - Name: PRIVATE_SUBNET_IDS
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-PrivateSubnetIds
          - Name: GO_TASK_SECURITY_GROUP_ID
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-GoTaskSecurityGroupId
          - Name: PUBLIC_API_BASE_URL
            Type: PLAINTEXT
            Value: !Ref PublicApiBaseUrl
          - Name: CORS_ORIGINS
            Type: PLAINTEXT
            Value: !Ref CorsOrigins
          - Name: CORS_PREVIEW_ORIGIN_SUFFIX
            Type: PLAINTEXT
            Value: .github-account-info.pages.dev
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref PreviewBuildLogGroup
          StreamName: build
        S3Logs:
          Status: DISABLED
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 30
      ConcurrentBuildLimit: 5
      BadgeEnabled: false
      Visibility: PRIVATE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: cloudformation

  PreviewTtlCleanupProject:
    # 定时兜底扫描器使用 NO_SOURCE 且 PrivilegedMode=false：它不运行仓库代码，
    # 只按 Project/Environment/ExpiresAt tag 找过期 Stack，再启动已受控的 cleanup build。
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-preview-ttl-cleanup
      Description: >-
        Trusted scheduled scanner that starts the already-tested PR cleanup
        build only for expired Project/Environment-tagged preview stacks.
      ServiceRole:
        Fn::ImportValue: !Sub ${ProjectName}-PreviewCodeBuildRoleArn
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          # TTL BuildSpec 同样是内嵌 YAML。它只读取标签和启动 CodeBuild，
          # 不直接删除 CloudFormation/ECS/数据库资源，复用正常 cleanup 安全门。
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                - set -euo pipefail
                - |
                  NOW_EPOCH="$(date -u +%s)"
                  mapfile -t STACK_ARNS < <(
                    aws resourcegroupstaggingapi get-resources \
                      --region "$AWS_DEFAULT_REGION" \
                      --resource-type-filters cloudformation:stack \
                      --tag-filters \
                        "Key=Project,Values=${PROJECT_NAME}" \
                        "Key=Environment,Values=preview" \
                      --query 'ResourceTagMappingList[].ResourceARN' \
                      --output text | tr '\t' '\n' | sed '/^$/d'
                  )

                  if (( ${#STACK_ARNS[@]} == 0 )); then
                    echo "No tagged preview stacks were found"
                    exit 0
                  fi

                  for STACK_ARN in "${STACK_ARNS[@]}"; do
                    # 即使资源带了正确 tag，仍再次校验 Stack 名和 PRNumber，
                    # 防止错误标签导致扫描器操作非 preview Stack。
                    STACK_PATH="${STACK_ARN#*:stack/}"
                    STACK_NAME="${STACK_PATH%%/*}"
                    PREFIX="${PROJECT_NAME}-pr-"
                    [[ "$STACK_NAME" == "$PREFIX"* ]] || {
                      echo "Ignoring unexpected tagged stack ARN" >&2
                      continue
                    }
                    PR_NUMBER="${STACK_NAME#"$PREFIX"}"
                    [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,4}$ ]] || {
                      echo "Ignoring preview stack with invalid PR number" >&2
                      continue
                    }
                    (( PR_NUMBER <= 49999 )) || {
                      echo "Ignoring preview stack outside listener priority range" >&2
                      continue
                    }

                    EXPIRES_AT="$(aws cloudformation describe-stacks \
                      --region "$AWS_DEFAULT_REGION" \
                      --stack-name "$STACK_ARN" \
                      --query 'Stacks[0].Tags[?Key==`ExpiresAt`].Value | [0]' \
                      --output text)"
                    [[ "$EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
                      echo "Ignoring ${STACK_NAME}: missing or invalid ExpiresAt" >&2
                      continue
                    }
                    EXPIRES_EPOCH="$(date -u -d "$EXPIRES_AT" +%s)"
                    if (( EXPIRES_EPOCH > NOW_EPOCH )); then
                      echo "${STACK_NAME} is not expired"
                      continue
                    fi

                    echo "Starting guarded cleanup for expired ${STACK_NAME}"
                    # 模拟 PR closed 事件启动同一个 preview Project，保证手动关闭
                    # 和 TTL 过期走完全相同、已经验收过的删除流程。
                    BUILD_ID="$(aws codebuild start-build \
                      --region "$AWS_DEFAULT_REGION" \
                      --project-name "${PROJECT_NAME}-preview" \
                      --source-version "pr/${PR_NUMBER}" \
                      --environment-variables-override \
                        name=CODEBUILD_WEBHOOK_EVENT,value=PULL_REQUEST_CLOSED,type=PLAINTEXT \
                      --query 'build.id' \
                      --output text)"
                    [[ "$BUILD_ID" == "${PROJECT_NAME}-preview:"* ]] || {
                      echo "Cleanup build did not start for ${STACK_NAME}" >&2
                      exit 1
                    }

                    CLEANUP_FINISHED=false
                    for _ in $(seq 1 120); do
                      BUILD_STATUS="$(aws codebuild batch-get-builds \
                        --region "$AWS_DEFAULT_REGION" \
                        --ids "$BUILD_ID" \
                        --query 'builds[0].buildStatus' \
                        --output text)"
                      case "$BUILD_STATUS" in
                        SUCCEEDED)
                          CLEANUP_FINISHED=true
                          break
                          ;;
                        FAILED|FAULT|STOPPED|TIMED_OUT)
                          echo "Cleanup build ${BUILD_ID} ended with ${BUILD_STATUS}" >&2
                          exit 1
                          ;;
                        IN_PROGRESS)
                          sleep 15
                          ;;
                        *)
                          echo "Unexpected cleanup build status: ${BUILD_STATUS}" >&2
                          exit 1
                          ;;
                      esac
                    done
                    [[ "$CLEANUP_FINISHED" == true ]] || {
                      echo "Timed out waiting for cleanup build ${BUILD_ID}" >&2
                      exit 1
                    }
                    echo "Expired preview ${STACK_NAME} was removed"
                  done
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: !Ref CodeBuildImage
        ComputeType: BUILD_GENERAL1_SMALL
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Type: PLAINTEXT
            Value: !Ref ProjectName
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref PreviewBuildLogGroup
          StreamName: ttl-cleanup
        S3Logs:
          Status: DISABLED
      TimeoutInMinutes: 35
      QueuedTimeoutInMinutes: 10
      ConcurrentBuildLimit: 1
      BadgeEnabled: false
      Visibility: PRIVATE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview-cleanup
        - Key: ManagedBy
          Value: cloudformation

  PreviewTtlCleanupSchedule:
    # EventBridge 定时规则只负责启动扫描 Project；RoleArn 是 EventBridge
    # 调用 CodeBuild 时扮演的角色，信任关系在 go-iam.yaml 中受 SourceArn 限制。
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-preview-ttl-cleanup
      Description: Starts the trusted tag-driven preview TTL scanner.
      ScheduleExpression: !Ref ScheduledPreviewCleanupExpression
      State: ENABLED
      Targets:
        - Id: PreviewTtlCleanupCodeBuild
          Arn: !GetAtt PreviewTtlCleanupProject.Arn
          RoleArn:
            Fn::ImportValue: !Sub ${ProjectName}-PreviewCodeBuildRoleArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: preview-cleanup
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  # 输出 Project/Rule 标识便于在 Console、CLI 和运行手册中定位资源。
  ProductionBuildProjectName:
    Value: !Ref ProductionBuildProject
  ProductionBuildProjectArn:
    # CodeBuild Project 的 !Ref 返回项目名；需要 ARN 时使用 !GetAtt .Arn。
    Value: !GetAtt ProductionBuildProject.Arn
  ProductionBuildLogGroupName:
    Value: !Ref ProductionBuildLogGroup
  PreviewBuildProjectName:
    Value: !Ref PreviewBuildProject
  PreviewBuildProjectArn:
    Value: !GetAtt PreviewBuildProject.Arn
  PreviewBuildLogGroupName:
    Value: !Ref PreviewBuildLogGroup
  PreviewTtlCleanupProjectName:
    Value: !Ref PreviewTtlCleanupProject
  PreviewTtlCleanupScheduleArn:
    Value: !GetAtt PreviewTtlCleanupSchedule.Arn
