AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Browser performance event queue, dead-letter queue, ECR repository and an
  isolated ECS Fargate processor that cleans events before CloudWatch and
  PostgreSQL persistence.

Parameters:
  ProjectName:
    Type: String
    Default: github-account-info-performance
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  FoundationProjectName:
    Type: String
    Default: github-account-info-go
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  ImageTag:
    Type: String
    Default: prod-0000000
    AllowedPattern: "^prod-[0-9a-f]{7,40}$"
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: >-
      Keep zero for the first stack creation, push the immutable image, then
      update to one.
  AlarmTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  PerformanceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-events
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PerformanceDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref ProjectName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the newest 20 processor images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["prod-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-execution-role
      Path: /github-account-info/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: pull-image-write-logs-read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullOnlyPerformanceImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt PerformanceRepository.Arn
              - Sid: WriteOnlyPerformanceLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PerformanceLogGroup.Arn
              - Sid: ReadOnlyDatabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub ${FoundationProjectName}-DatabaseUrlSecretArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-task-role
      Path: /github-account-info/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: consume-only-performance-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt PerformanceQueue.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt PerformanceExecutionRole.Arn
      TaskRoleArn: !GetAtt PerformanceTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: performance-processor
          Essential: true
          Image: !Sub ${PerformanceRepository.RepositoryUri}:${ImageTag}
          User: "65532:65532"
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PERFORMANCE_QUEUE_URL
              Value: !Ref PerformanceQueue
            - Name: POLL_WAIT_SECONDS
              Value: "20"
            - Name: VISIBILITY_TIMEOUT_SECONDS
              Value: "120"
            - Name: RDS_CA_BUNDLE
              Value: /app/certs/rds-bundle.pem
          Secrets:
            - Name: DATABASE_URL
              ValueFrom:
                Fn::ImportValue: !Sub ${FoundationProjectName}-DatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PerformanceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: processor
              mode: non-blocking
              max-buffer-size: 4m
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ProjectName
      Cluster:
        Fn::ImportValue: !Sub ${FoundationProjectName}-EcsClusterArn
      TaskDefinition: !Ref PerformanceTaskDefinition
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: 1
          Weight: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${FoundationProjectName}-PrivateSubnetIds
          SecurityGroups:
            - Fn::ImportValue: !Sub ${FoundationProjectName}-GoTaskSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  PerformanceDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-dlq-not-empty
      AlarmDescription: Performance events exhausted all cleaning retries.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PerformanceDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]

  PerformanceQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-oldest-message
      AlarmDescription: Performance event cleaning has been delayed for five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PerformanceQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]

Outputs:
  PerformanceQueueUrl:
    Value: !Ref PerformanceQueue
  PerformanceQueueArn:
    Value: !GetAtt PerformanceQueue.Arn
  PerformanceDeadLetterQueueUrl:
    Value: !Ref PerformanceDeadLetterQueue
  PerformanceRepositoryUri:
    Value: !GetAtt PerformanceRepository.RepositoryUri
  PerformanceServiceName:
    Value: !GetAtt PerformanceService.Name
  PerformanceLogGroupName:
    Value: !Ref PerformanceLogGroup
