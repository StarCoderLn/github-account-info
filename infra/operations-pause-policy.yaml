AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Least-privilege reversible runtime pause policy for github-account-info.

Parameters:
  DeploymentRoleName:
    Type: String
    Default: github-actions-deployer
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

Resources:
  OperationsPausePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: github-account-info-operations-pause
      Description: Stops and starts only the fixed github-account-info runtime resources.
      Roles:
        - !Ref DeploymentRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ObserveRuntime
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
              - ec2:DescribeInstances
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:DescribeTaskDefinition
              - rds:DescribeDBInstances
            Resource: "*"
          - Sid: StopFixedInstance
            Effect: Allow
            Action:
              - ec2:StartInstances
              - ec2:StopInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/i-0fe5bdd02a913b64a
          - Sid: StopFixedDatabase
            Effect: Allow
            Action:
              - rds:StartDBInstance
              - rds:StopDBInstance
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:github-account-info-db
          - Sid: PauseFixedEcsServices
            Effect: Allow
            Action:
              - ecs:ListTagsForResource
              - ecs:UpdateService
            Resource:
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-production
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-production-canary
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-performance
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-pr-27
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-pr-30
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-pr-31
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-pr-32
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/github-account-info-go/github-account-info-go-pr-39
          - Sid: PausePerformanceScaling
            Effect: Allow
            Action:
              - cloudwatch:DisableAlarmActions
              - cloudwatch:EnableAlarmActions
            Resource:
              - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:github-account-info-performance-queue-scale-out
              - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:github-account-info-performance-queue-scale-in

Outputs:
  ManagedPolicyArn:
    Value: !Ref OperationsPausePolicy
