# 这是 AWS SAM 模板。SAM 是 CloudFormation 的扩展语法；部署时会先把
# AWS::Serverless::* 资源转换成普通 Lambda、IAM、API Gateway 等资源。
# 学习顺序建议：Globals（函数公共默认值）→ Parameters（部署输入）→
# Conditions（条件开关）→ Resources（真实云资源）→ Outputs（部署结果）。
AWSTemplateFormatVersion: "2010-09-09"
# Transform 声明让 CloudFormation 使用 SAM 转换器解析本文件。
Transform: AWS::Serverless-2016-10-31
Description: >-
  Explicit HTTP API routing for the existing Node Lambda and the private Go
  ECS service. Public Go reads use VPC Link -> Internal ALB; /internal is not
  configured as an API Gateway route.

# CloudFormation 内置函数速查（带 ! 的写法是 YAML 短格式）：
# - !Ref X：引用 X。X 是 Parameter 时返回传入值；X 是 Resource 时返回该资源
#   文档规定的主标识，例如 Lambda 名、API ID、Stage 名或 VPC Link ID。
# - !Sub "...${X}..."：先解析 ${X}，再拼接字符串。${Resource.Attribute}
#   相当于 GetAtt，${AWS::Region} 等则是 CloudFormation 自动提供的伪参数。
# - !GetAtt Resource.Attribute：读取已创建资源的特定属性，最常见的是 Arn、
#   DNSName、Name；可用属性由每种 AWS 资源的 CloudFormation 文档定义。
# - Fn::ImportValue：读取另一个 Stack 通过 Outputs.Export 导出的值。
# - !Split：把字符串按分隔符切成列表，本模板用它把逗号分隔的子网 ID 转回数组。
# - !Equals / !Not：只用于 Conditions，组合出 true/false 条件。
# - !If [条件, 真值, 假值]：部署求值时二选一；AWS::NoValue 表示彻底移除该属性。
# - AWS::AccountId、Region、Partition、StackName、URLSuffix 都是伪参数，部署时
#   CloudFormation 自动填入，不需要在 Parameters 中声明。

Globals:
  # Globals.Function 中的配置会自动应用到本模板的所有 SAM Function；
  # 具体函数仍可在自己的 Properties 中覆盖这些默认值。
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    # Lambda 必须进入私有子网，才能访问 RDS 和 Cloud Map 中的 Go 服务。
    VpcConfig:
      # !Ref Parameter 返回部署时传入的列表本身；这里的结果类型仍是 List，
      # 正好符合 VpcConfig.SubnetIds / SecurityGroupIds 的类型要求。
      SubnetIds: !Ref LambdaSubnetIds
      SecurityGroupIds: !Ref LambdaSecurityGroupIds

Parameters:
  # Parameters 是部署时传入的变量，同一份模板可用于不同环境。
  ProjectName:
    Type: String
    Default: github-account-info-go
    MinLength: 3
    MaxLength: 22
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  DatabaseUrl:
    Type: String
    # NoEcho 只负责在 CloudFormation 界面隐藏参数值，不等同于 Secrets Manager；
    # 不要把真实连接串提交到模板、终端历史或部署日志。
    NoEcho: true
  CorsOrigin:
    Type: String
    AllowedPattern: "^https?://[^/?#]+$"
    ConstraintDescription: Enter one exact HTTP(S) origin without a path or trailing slash.
  GoApiInternalUrl:
    Type: String
    Default: http://go-api.github-account-info.local:8080
    AllowedPattern: "^http://[a-z0-9.-]+:[0-9]+$"
    ConstraintDescription: Enter the private Cloud Map base URL without a path.
  ProfileEventsTopicArn:
    Type: String
    Default: ""
    # 留空时既不注入有效 publisher，也不创建 IAM policy，便于本地/分阶段部署。
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"
    Description: Optional SNS topic for credential-free introduction.ready events.
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0271ef8002e00346a
    Description: Existing private subnet IDs used by the Node Lambda.
  LambdaSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Default: sg-0f1137c6844a4c9fb
    Description: Existing security group IDs used by the Node Lambda.
  AlarmTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"
    Description: >-
      Optional existing SNS topic ARN for API alarm and recovery notifications.

Conditions:
  # 内层 !Ref 先取得 AlarmTopicArn 字符串；!Equals 将它与空字符串比较；
  # 外层 !Not 再反转结果，所以“传了非空 ARN”时 HasAlarmTopic 才为 true。
  # 后面通过 !If + AWS::NoValue 决定是否真正配置告警通知动作。
  HasAlarmTopic: !Not
    - !Equals
      - !Ref AlarmTopicArn
      - ""
  HasProfileEventsTopic: !Not
    - !Equals
      - !Ref ProfileEventsTopicArn
      - ""

Resources:
  # Node/tRPC Lambda。AWS::Serverless::Function 是 SAM 简写，SAM 会为它
  # 生成底层 Lambda 资源和运行角色等必要资源。
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: github-account-info-api
      Handler: lambda.handler
      CodeUri: dist/
      Description: GitHub Account Info Node/tRPC API
      Environment:
        Variables:
          # 这三个 !Ref 都引用 Parameter，因此返回部署者传入的原始字符串，
          # CloudFormation 再把字符串写进 Lambda 环境变量。
          DATABASE_URL: !Ref DatabaseUrl
          CORS_ORIGIN: !Ref CorsOrigin
          GO_API_INTERNAL_URL: !Ref GoApiInternalUrl
          PROFILE_EVENTS_TOPIC_ARN: !Ref ProfileEventsTopicArn
          # Preserve the existing unauthenticated production management flow.
          # This is an explicit compatibility choice; CORS is not authentication.
          MANAGEMENT_API_ENABLED: "true"
          NODE_ENV: production

  ApiProfileEventsPublishPolicy:
    # 独立 inline policy 绑定 SAM 自动生成的执行角色，仅允许发布到参数指定 Topic。
    # 不授予 sns:*，也不允许列出或读取账号内其他 Topic。
    Type: AWS::IAM::Policy
    Condition: HasProfileEventsTopic
    Properties:
      PolicyName: publish-profile-events
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishOnlyConfiguredProfileEventsTopic
            Effect: Allow
            Action: sns:Publish
            Resource: !Ref ProfileEventsTopicArn

  # 保留旧版隐式 SAM HttpApi 生成的逻辑 ID，使 CloudFormation 能原地更新
  # 已有 API，而不是悄悄创建第二个公网入口。部署前仍要在 Change Set 中
  # 确认该资源不会发生 Replacement。
  ServerlessHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      # 保持旧版隐式 SAM API 使用的 OpenAPI Body 结构。这里若新增
      # ProtocolType 会替换现有 API 并改变 API ID，因此不能随意调整。
      Body:
        openapi: "3.0.1"
        info:
          # AWS::StackName 是伪参数，返回当前 CloudFormation Stack 的实际名称；
          # 它不是本文件中声明的 Resource 或 Parameter。
          title: !Ref AWS::StackName
          version: "1.0"
        tags:
          - name: httpapi:createdBy
            x-amazon-apigateway-tag-value: SAM
        paths:
          "/":
            # 根路径和 /trpc/* 都采用 Lambda AWS_PROXY 集成。
            get:
              responses: {}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                # !Sub 会把 ${变量} 替换成参数、伪参数或资源属性；
                # AWS::Partition 让 ARN 同时兼容 aws/aws-cn/aws-us-gov。
                # API Gateway 必须调用 live Alias，部署脚本设置的 10%/90% 权重
                # 才会作用到真实 API 流量；直接调用函数 ARN会绕过灰度。
                uri: !Sub
                  - >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiAliasArn}/invocations
                  - ApiAliasArn: !Sub ${ApiFunction.Arn}:live
                payloadFormatVersion: "2.0"
                timeoutInMillis: 30000
          "/trpc/{proxy+}":
            x-amazon-apigateway-any-method:
              parameters:
                - in: path
                  name: proxy+
                  required: true
              responses: {}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiAliasArn}/invocations
                  - ApiAliasArn: !Sub ${ApiFunction.Arn}:live
                payloadFormatVersion: "2.0"
                timeoutInMillis: 30000
            options:
              parameters:
                - in: path
                  name: proxy+
                  required: true
              responses: {}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiAliasArn}/invocations
                  - ApiAliasArn: !Sub ${ApiFunction.Arn}:live
                payloadFormatVersion: "2.0"
                timeoutInMillis: 30000
          "/api/v1/{proxy+}":
            # Go 的公开只读接口经 VPC Link 转发到 Internal ALB；模板刻意
            # 不声明 /internal/*，因此内部写接口不会暴露到公网。
            get:
              parameters:
                - in: path
                  name: proxy+
                  required: true
              responses: {}
              # &name 是 YAML 锚点，不是 CloudFormation 函数：它给下面这一整段
              # integration 配置起名，供 /healthz 和 /readyz 用 *name 原样复用。
              x-amazon-apigateway-integration: &go-private-get-integration
                type: http_proxy
                httpMethod: GET
                connectionType: VPC_LINK
                # 对 AWS::ApiGatewayV2::VpcLink 使用 !Ref，返回创建后的 VPC Link ID。
                connectionId: !Ref GoApiVpcLink
                uri:
                  # Fn::ImportValue 读取 go-foundation.yaml 导出的监听器 ARN，
                  # 这是两个 CloudFormation Stack 之间的显式依赖契约。
                  # Export 名也要由 ProjectName 动态拼接，所以内层使用 !Sub。
                  # 这里写完整 Fn::ImportValue，是为了避免两个 YAML 短标签直接嵌套。
                  Fn::ImportValue: !Sub ${ProjectName}-InternalHttpListenerArn
                payloadFormatVersion: "1.0"
                timeoutInMillis: 30000
                requestParameters:
                  overwrite:path: "$request.path"
            options:
              parameters:
                - in: path
                  name: proxy+
                  required: true
              responses: {}
              x-amazon-apigateway-integration: &go-private-options-integration
                type: http_proxy
                httpMethod: OPTIONS
                connectionType: VPC_LINK
                connectionId: !Ref GoApiVpcLink
                uri:
                  Fn::ImportValue: !Sub ${ProjectName}-InternalHttpListenerArn
                payloadFormatVersion: "1.0"
                timeoutInMillis: 30000
                requestParameters:
                  overwrite:path: "$request.path"
          "/healthz":
            get:
              responses: {}
              # *name 是 YAML 别名：展开前面 &go-private-get-integration 的完整映射，
              # 避免复制一份容易逐渐不一致的 VPC Link 配置。
              x-amazon-apigateway-integration: *go-private-get-integration
          "/readyz":
            get:
              responses: {}
              x-amazon-apigateway-integration: *go-private-get-integration

  HttpApiAccessLogGroup:
    # API Gateway 访问日志单独保存。Retain 表示删除或替换 Stack 时保留日志，
    # 方便事后审计；代价是需要在确认无用后手动清理。
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/apigateway/github-account-info-http-api
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  # 同样保留旧版隐式 SAM HttpApi 生成的 Stage 逻辑 ID，以便原地更新
  # $default Stage。AutoDeploy=true 表示路由变化后无需单独创建 Deployment。
  ServerlessHttpApiApiGatewayDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ServerlessHttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        # !GetAtt 的左边是模板内逻辑 ID，右边 Arn 是该资源公开的属性；
        # 与 !Ref 不同，!GetAtt 可以明确选择“我要 ARN 而不是资源主标识”。
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      Tags:
        Project: !Ref ProjectName
        ManagedBy: cloudformation

  LambdaInvokePermission:
    # Lambda Permission 是“资源策略”：它允许指定 API Gateway 调用函数。
    # SourceAccount + SourceArn 同时限制来源，避免任意 API Gateway 借用权限。
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      # 对 SAM Function 使用 !Ref，返回底层 Lambda 的函数名，符合
      # AWS::Lambda::Permission.FunctionName 可接受的输入类型。
      FunctionName: !Sub ${ApiFunction.Arn}:live
      # AWS::AccountId 是当前部署账户的 12 位 ID；无需手工传参。
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessHttpApi}/*

  GoApiVpcLink:
    # VPC Link 是 API Gateway 进入私有 VPC 的网桥。它使用 foundation Stack
    # 导出的私有子网和专用安全组，最终只允许流量到 Internal ALB。
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      # !Sub 也可用于普通名称；这里把 ProjectName 参数插入固定后缀。
      Name: !Sub ${ProjectName}-vpc-link
      # foundation Stack 为了 Export List，把子网列表用逗号拼成了字符串；
      # !Split 的第一个参数是分隔符，第二个参数是待拆分字符串，结果重新变成 List。
      SubnetIds: !Split
        - ","
        - Fn::ImportValue: !Sub ${ProjectName}-PrivateSubnetIds
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-VpcLinkSecurityGroupId
      Tags:
        Project: !Ref ProjectName
        ManagedBy: cloudformation

  HttpApi5xxAlarm:
    # 连续两个 60 秒周期出现 5xx 才报警，减少瞬时错误造成的噪声。
    # TreatMissingData=notBreaching 表示没有请求/指标时不视为故障。
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-http-api-5xx
      AlarmDescription: HTTP API returned repeated server-side errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ServerlessHttpApi
        - Name: Stage
          Value: !Ref ServerlessHttpApiApiGatewayDefaultStage
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        # !If 的三个位置依次是：Condition 名、条件为真时的值、条件为假时的值。
        # AWS::NoValue 是特殊伪参数：它不是 null，而是让 CloudFormation 删除
        # 这个列表项，所以未配置 SNS 时 AlarmActions 最终为空列表。
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      OKActions:
        - !If [HasAlarmTopic, !Ref AlarmTopicArn, !Ref AWS::NoValue]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  # Outputs 展示部署结果，也可以通过 Export 给其他 Stack 使用。
  # 本模板的输出主要用于部署验收和排障，不承担跨 Stack 导出。
  ApiId:
    Description: Explicit HTTP API identifier.
    # 对 API Resource 使用 !Ref 返回 API ID，而不是完整 ARN。
    Value: !Ref ServerlessHttpApi
  ApiUrl:
    Description: API Gateway default-stage endpoint URL.
    # !Sub 同时解析 Resource(!Ref 语义)和 Region/URLSuffix 伪参数，最终得到 URL。
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  ApiLiveAliasArn:
    Description: Lambda alias used by API Gateway and native weighted routing.
    Value: !Sub ${ApiFunction.Arn}:live
  GoApiVpcLinkId:
    Description: VPC Link used only for public Go routes.
    Value: !Ref GoApiVpcLink
  PublicRouteBoundary:
    Description: /internal is intentionally absent.
    Value: /trpc/* -> Lambda; GET /api/v1/*, /healthz, /readyz -> VPC Link -> Internal ALB
